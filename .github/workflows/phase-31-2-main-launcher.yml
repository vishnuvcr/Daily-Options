name: Phase 31.2 launcher - Phase 31.1 forensic audit
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/phase31_2-main-launch.txt"
      - ".github/workflows/phase-31-2-main-launcher.yml"
permissions:
  contents: write
concurrency:
  group: phase31-2-main-launcher
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-31.2-phase31-1-forensic-audit-v1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.3.2 numpy==2.1.3 duckdb==1.3.2 pyarrow==19.0.1 pytest==8.4.2 huggingface_hub==0.35.3
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase31_2_forensic_audit.py
      - name: Cache pinned NIFTY source
        uses: actions/cache@v4
        with:
          path: data/cache/phase31_trademarkk
          key: phase31-trademarkk-51ca58c-v1
          restore-keys: |
            phase31-trademarkk-51ca58c-
            phase30-trademarkk-51ca58c-
      - name: Acquire or reuse exact-expiry NIFTY data
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase31_trademarkk
          if [ ! -f data/cache/phase31_trademarkk/index/NIFTY.parquet ]; then
            for attempt in 1 2 3 4; do
              python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m",repo_type="dataset",revision="51ca58c",local_dir="data/cache/phase31_trademarkk",allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"])' && break
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep $((attempt*15))
            done
          fi
          test -f data/cache/phase31_trademarkk/index/NIFTY.parquet
      - name: Run forensic audit
        run: PYTHONPATH=. python research/phase31_2_forensic_audit.py --data data/cache/phase31_trademarkk --out reports/phase31_2
      - name: Write final audit result
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          a=json.loads(Path("reports/phase31_2/forensic_audit.json").read_text())
          stress=json.loads(Path("reports/phase31_1/stress/summary.json").read_text())
          lines=[
            "# Phase 31.2 forensic audit result","",
            f"Decision: **{a.get('decision','UNKNOWN')}**","",
            f"Audited sample: {a.get('sample_rows',0)} executed days; reconciliation matches: {a.get('sample_matches',0)}; mismatches: {a.get('sample_mismatches',0)}.","",
            f"Reference Base total net: ₹{a.get('reference_total_net',0):,.2f}; mean weekly net: ₹{a.get('reference_mean_week',0):,.2f}; positive-week rate: {a.get('reference_positive_week_rate',0)*100:.2f}%.",
            f"Reference Stress total net: ₹{stress.get('total_net',0):,.2f}; mean weekly net: ₹{stress.get('mean_weekly_net',0):,.2f}.","",
            f"Persisted Base slippage reconstructed from leg records: ₹{a.get('persisted_total_slippage_cost',0):,.2f}. Slippage-adjusted total net: ₹{a.get('slippage_adjusted_total_net',0):,.2f}; mean weekly net: ₹{a.get('slippage_adjusted_mean_week',0):,.2f}; positive-week rate: {a.get('slippage_adjusted_positive_week_rate',0)*100:.2f}%.","",
            "The persisted artifact reconciles to raw gross P&L minus transaction/statutory costs. The current checked-in simulator applies slippage inside execution gross; this provenance/semantic mismatch keeps Phase 31.1 quarantined.","",
            "The 09:30→15:10 central expiry band is diagnostic only; it is not treated as the 15:10 mark-to-market payoff.","",
            "See forensic_audit.json, sample_reconciliation.csv, and payoff_diagnostics.csv."
          ]
          Path("reports/phase31_2/final_result.md").write_text("\n".join(lines)+"\n")
          PY
      - name: Persist to audit branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/phase31_2
          if ! git diff --cached --quiet; then
            git commit -m "Phase 31.2: persist launcher audit result"
            git push origin HEAD:phase-31.2-phase31-1-forensic-audit-v1
          fi
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase31-2-main-launcher-audit
          path: reports/phase31_2/
