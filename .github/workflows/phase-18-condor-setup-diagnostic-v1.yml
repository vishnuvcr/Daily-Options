name: Phase 18 Condor Setup Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [phase-18-condor-setup-diagnostic-v1]

concurrency:
  group: phase18-condor-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-18-condor-setup-diagnostic-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy pyarrow duckdb huggingface_hub pytest
      - name: Cache TradeMarkk NIFTY
        uses: actions/cache@v4
        with:
          path: data/cache/phase18_trademarkk
          key: phase18-trademarkk-setupdiag-v1
          restore-keys: |
            phase18-trademarkk-51ca58c-
      - name: Acquire or reuse data
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase18_trademarkk
          if [ ! -f data/cache/phase18_trademarkk/index/NIFTY.parquet ]; then
            for attempt in 1 2 3 4; do
              python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m",repo_type="dataset",revision="51ca58c",local_dir="data/cache/phase18_trademarkk",allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"])' && break
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep $((attempt*15))
            done
          fi
      - name: Diagnostic
        run: PYTHONPATH=. python -m research.phase18_setup_diagnostic --data data/cache/phase18_trademarkk --out reports/diagnostic
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-condor-setup-diagnostic-v1
          path: reports/diagnostic/
