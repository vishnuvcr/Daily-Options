name: Phase 20 - Global-Gated Fast Artifact Audit

on:
  workflow_dispatch:
  push:
    branches:
      - phase-20-global-gated-fast-audit

concurrency:
  group: phase20-global-gated-fast-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-20-global-gated-fast-audit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy pyarrow openpyxl xlrd duckdb yfinance pytest

      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase13_late_day_volatility_acceleration.py

      - name: Cache global daily data
        uses: actions/cache@v4
        with:
          path: data/cache/phase20_global
          key: phase20-global-daily-2019-2020-v1

      - name: Download frozen Phase 13 artifact
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf data/cache/phase13_artifact
          mkdir -p data/cache/phase13_artifact
          gh run download 35994608170 \
            --name phase13-late-day-volatility-v1 \
            --dir data/cache/phase13_artifact

      - name: Run fixed-gate audit
        run: |
          rm -rf reports/phase20-fast-audit
          PYTHONPATH=. python -m research.phase13_late_day_volatility_acceleration \
            --root data/cache/phase12_zenodo \
            --global-root data/cache/phase20_global \
            --fast-audit-dir data/cache/phase13_artifact \
            --out reports/phase20-fast-audit

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase20-fast-artifact-audit
          path: reports/phase20-fast-audit/
