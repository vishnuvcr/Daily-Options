name: Phase 28 - Deduplication and family clustering

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-28-equity-income-dedup-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Phase definition
        run: |
          echo "Phase 28: Deduplication and family clustering"
          echo "Manual execution branch: phase-28-equity-income-dedup-v1"
          echo "Weekly target: INR 5,000 net per traded week at fixed reference sizing"
          echo "Scope: Map videos to canonical payoff families and remove duplicate experiments."
