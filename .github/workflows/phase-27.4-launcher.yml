name: Phase 27.4 - launcher

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/phase27-4-launch-trigger.txt"
  pull_request:
    paths:
      - ".github/phase27-4-launch-trigger.txt"

permissions:
  contents: write

concurrency:
  group: phase27-4-equity-income-launcher
  cancel-in-progress: true

jobs:
  precision:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Phase 27.4 branch
        uses: actions/checkout@v4
        with:
          ref: phase-27.4-equity-income-evidence-precision-v1
          fetch-depth: 0
      - name: Sync priority input
        run: |
          set -euo pipefail
          git fetch origin phase-27.2-equity-income-reconstruction-priority-v1
          git restore --source=origin/phase-27.2-equity-income-reconstruction-priority-v1 -- reports/phase27_2_reconstruction_priority.csv
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install requests==2.34.2 pytest==8.4.2
      - name: Unit tests
        run: python -m pytest -q tests/test_phase27_4_precision.py
      - name: Build precision-clean evidence
        run: python research/phase27_4_precision.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          s=json.load(open('data/equity_income/phase27_4_summary.json'))
          assert s['candidates']==8
          assert s['backtest_allowed']==0
          print(json.dumps(s,indent=2))
          PY
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/equity_income/phase27_4_t1_clean_evidence.jsonl data/equity_income/phase27_4_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Phase 27.4: persist precision-clean T1 evidence"
          git push origin HEAD:phase-27.4-equity-income-evidence-precision-v1
