name: Phase 10 - Cross Index 1m Options

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - phase-10-cross-index-1m-v4-exec
    paths:
      - "research/phase10_cross_index.py"
      - "research/phase10_contracts.py"
      - "tests/test_phase10_cross_index.py"
      - "docs/phase10_hypothesis.md"
      - ".github/workflows/phase-10-cross-index-1m-v4-exec.yml"
      - "research/cost_model.py"

concurrency:
  group: phase10-cross-index-1m
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy pyarrow duckdb pytest huggingface_hub pytz
      - name: Unit tests
        run: pytest -q tests/test_phase10_cross_index.py
      - uses: actions/cache@v4
        with:
          path: data/cache/thetrademarkk_index_options
          key: thetrademarkk-index-options-1m-v1
      - name: Acquire or reuse research data
        run: |
          mkdir -p data/cache/thetrademarkk_index_options
          if ! find data/cache/thetrademarkk_index_options -type f -name '*.parquet' -print -quit | grep -q .; then
            python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m", repo_type="dataset", local_dir="data/cache/thetrademarkk_index_options", allow_patterns=["index/NIFTY.parquet","index/BANKNIFTY.parquet","options/NIFTY/*.parquet","options/BANKNIFTY/*.parquet"])'
          fi
          test -f data/cache/thetrademarkk_index_options/index/NIFTY.parquet
          test -f data/cache/thetrademarkk_index_options/index/BANKNIFTY.parquet
      - name: Base friction
        run: python -m research.phase10_cross_index --data data/cache/thetrademarkk_index_options --out reports/phase10-base --slippage 0.20
      - name: Stress friction
        run: python -m research.phase10_cross_index --data data/cache/thetrademarkk_index_options --out reports/phase10-stress --slippage 0.40
      - name: Decision summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload={
            "base":json.loads(Path("reports/phase10-base/phase10_summary.json").read_text()) if Path("reports/phase10-base/phase10_summary.json").exists() else {},
            "stress":json.loads(Path("reports/phase10-stress/phase10_summary.json").read_text()) if Path("reports/phase10-stress/phase10_summary.json").exists() else {},
          }
          Path("reports/phase10_decision_summary.json").write_text(json.dumps(payload,indent=2,default=str))
          print(json.dumps(payload,indent=2,default=str))
          PY
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase10-cross-index-1m
          path: reports/
