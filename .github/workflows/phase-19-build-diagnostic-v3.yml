name: Phase 19 diagnostic v3 - timestamp distribution

on:
  workflow_dispatch:
  push:
    branches: [phase-19-nifty-short-strangle-regime-v1]

concurrency:
  group: phase19-diagnostic-v3
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-19-nifty-short-strangle-regime-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy pyarrow duckdb huggingface_hub
      - uses: actions/cache@v4
        with:
          path: data/cache/phase19_trademarkk
          key: phase19-trademarkk-51ca58c-v1
          restore-keys: |
            phase17-trademarkk-51ca58c-v1
            phase17-trademarkk-51ca58c-
      - name: Acquire or reuse data
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase19_trademarkk
          if [ ! -f data/cache/phase19_trademarkk/index/NIFTY.parquet ]; then
            python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m",repo_type="dataset",revision="51ca58c",local_dir="data/cache/phase19_trademarkk",allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"])'
          fi
      - run: PYTHONPATH=. python -m research.phase19_build_diagnostic data/cache/phase19_trademarkk reports/diag
      - uses: actions/upload-artifact@v4
        with:
          name: phase19-build-diagnostic-v3
          path: reports/diag/
