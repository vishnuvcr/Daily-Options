name: Phase 12 - Zenodo Futures/Spot Lead-Lag Pilot

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - phase-12-derivative-lead-options-v3-zenodo-pilot
    paths:
      - ".github/workflows/phase-11-breakout-pullback-oi-v5-exec.yml"
      - "research/phase12_zenodo_pilot.py"
      - "tests/test_phase12_zenodo_pilot.py"
      - "research/cost_model.py"
      - "research/phase10_contracts.py"

concurrency:
  # Never serialize research runs behind a slow archive download.
  # Each commit is independently reproducible; a newer corrected head
  # must be able to start immediately.
  group: phase12-zenodo-v3-${{ github.sha }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas numpy pyarrow openpyxl xlrd pytest

      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase12_zenodo_pilot.py

      - name: Prepare research cache
        uses: actions/cache@v4
        with:
          path: |
            data/cache/phase12_zenodo
          key: phase12-zenodo-2019-2020-v1

      - name: Acquire Zenodo archive
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase12_zenodo/downloads
          mkdir -p data/cache/phase12_zenodo/market
          mkdir -p data/cache/phase12_zenodo/options

          BASE="https://zenodo.org/records/10899828/files"
          FUT_ZIP="data/cache/phase12_zenodo/downloads/Nifty_spot_and_futures_data.zip"
          OPT_ZIP="data/cache/phase12_zenodo/downloads/Nifty_Options_Data.zip"

          if [ ! -s "$FUT_ZIP" ]; then
            curl -fL --retry 7 --retry-all-errors --connect-timeout 30               -A "Daily-Options-research/1.0"               "$BASE/Nifty%20spot%20and%20futures%20data.zip?download=1"               -o "$FUT_ZIP"
          fi

          if [ ! -s "$OPT_ZIP" ]; then
            curl -fL --retry 7 --retry-all-errors --connect-timeout 30               -A "Daily-Options-research/1.0"               "$BASE/Nifty%20Options%20Data.zip?download=1"               -o "$OPT_ZIP"
          fi

          test -s "$FUT_ZIP"
          test -s "$OPT_ZIP"

      - name: Extract 2019-2020 pilot data
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase12_zenodo/market
          mkdir -p data/cache/phase12_zenodo/options

          FUT_ZIP="data/cache/phase12_zenodo/downloads/Nifty_spot_and_futures_data.zip"
          OPT_ZIP="data/cache/phase12_zenodo/downloads/Nifty_Options_Data.zip"

          for YEAR in 2019 2020; do
            if [ ! -d "data/cache/phase12_zenodo/market/$YEAR" ]; then
              entry="$(unzip -Z1 "$FUT_ZIP" | grep -E "(^|/)$YEAR\.zip$" | head -1 || true)"
              test -n "$entry"
              unzip -p "$FUT_ZIP" "$entry" > "/tmp/$YEAR-futures.zip"
              mkdir -p "data/cache/phase12_zenodo/market/$YEAR"
              unzip -q "/tmp/$YEAR-futures.zip" -d "data/cache/phase12_zenodo/market/$YEAR"
            fi

            if [ ! -d "data/cache/phase12_zenodo/options/$YEAR" ]; then
              entry="$(unzip -Z1 "$OPT_ZIP" | grep -E "(^|/)NiftyOptions $YEAR\.zip$" | head -1 || true)"
              test -n "$entry"
              unzip -p "$OPT_ZIP" "$entry" > "/tmp/$YEAR-options.zip"
              mkdir -p "data/cache/phase12_zenodo/options/$YEAR"
              unzip -q "/tmp/$YEAR-options.zip" -d "data/cache/phase12_zenodo/options/$YEAR"
            fi
          done

          for YEAR in 2019 2020; do
            for PASS in 1 2 3 4; do
              FOUND=0
              while IFS= read -r -d '' MONTH_ZIP; do
                FOUND=1
                DEST="${MONTH_ZIP%.zip}"
                mkdir -p "$DEST"
                unzip -qo "$MONTH_ZIP" -d "$DEST"
                mv "$MONTH_ZIP" "${MONTH_ZIP}.processed"
              done < <(find "data/cache/phase12_zenodo/options/$YEAR" -type f -name '*.zip' -print0)
              if [ "$FOUND" -eq 0 ]; then
                break
              fi
            done
          done

          find data/cache/phase12_zenodo/market -type f -print | sed -n '1,20p'
          find data/cache/phase12_zenodo/options -type f -print | sed -n '1,20p'

      - name: Inspect Zenodo raw schemas
        run: |
          echo "=== NIFTY.csv ==="
          find data/cache/phase12_zenodo/market -type f -name 'NIFTY.csv' -print -exec head -12 {} \;
          echo "=== NIFTY_F1.csv ==="
          find data/cache/phase12_zenodo/market -type f -name 'NIFTY_F1.csv' -print -exec head -12 {} \;
          echo "=== Sample option files ==="
          find data/cache/phase12_zenodo/options -type f \( -name '*.xlsx' -o -name '*.xls' -o -name '*.csv' -o -name '*.txt' \) -print | sed -n '1,5p'

      - name: Data and pilot metadata audit
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("data/cache/phase12_zenodo")
          market = list((root / "market").rglob("*"))
          options = list((root / "options").rglob("*"))
          print("market_files", sum(p.is_file() for p in market))
          print("option_files", sum(p.is_file() for p in options))
          if not any(p.is_file() for p in market):
              raise SystemExit("No extracted market files")
          if not any(p.is_file() for p in options):
              raise SystemExit("No extracted option files")
          PY

      - name: Base friction
        run: |
          PYTHONPATH=. python -m research.phase12_zenodo_pilot             --root data/cache/phase12_zenodo             --out reports/phase12-zenodo-base             --slippage 0.20

      - name: Stress friction
        run: |
          PYTHONPATH=. python -m research.phase12_zenodo_pilot             --root data/cache/phase12_zenodo             --out reports/phase12-zenodo-stress             --slippage 0.40

      - name: Decision summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = {
              "base": json.loads(Path("reports/phase12-zenodo-base/phase12_zenodo_summary.json").read_text())
              if Path("reports/phase12-zenodo-base/phase12_zenodo_summary.json").exists() else {},
              "stress": json.loads(Path("reports/phase12-zenodo-stress/phase12_zenodo_summary.json").read_text())
              if Path("reports/phase12-zenodo-stress/phase12_zenodo_summary.json").exists() else {},
          }
          Path("reports/phase12_zenodo_decision_summary.json").parent.mkdir(parents=True, exist_ok=True)
          Path("reports/phase12_zenodo_decision_summary.json").write_text(
              json.dumps(payload, indent=2, default=str)
          )
          print(json.dumps(payload, indent=2, default=str))
          PY

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase12-zenodo-pilot-v3
          path: reports/

