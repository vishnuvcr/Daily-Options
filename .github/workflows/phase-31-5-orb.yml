name: Phase 31.5 - finite ORB candidate testing
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/phase31_5_orb_discovery.py'
      - 'docs/phase31_5_plan.md'
      - '.github/workflows/phase-31-5-orb.yml'
permissions:
  contents: write
jobs:
  orb:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.3.2 numpy==2.1.3 duckdb==1.3.2 pyarrow==19.0.1 huggingface_hub==0.35.3
      - name: Cache pinned NIFTY source
        uses: actions/cache@v4
        with:
          path: data/cache/phase31_trademarkk
          key: phase31-trademarkk-51ca58c-v1
          restore-keys: |
            phase31-trademarkk-51ca58c-
            phase30-trademarkk-51ca58c-
      - name: Acquire or reuse exact-expiry NIFTY data
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase31_trademarkk
          if [ ! -f data/cache/phase31_trademarkk/index/NIFTY.parquet ]; then
            python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m",repo_type="dataset",revision="51ca58c",local_dir="data/cache/phase31_trademarkk",allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"])'
          fi
      - name: Run finite ORB discovery
        run: PYTHONPATH=. python research/phase31_5_orb_discovery.py --data data/cache/phase31_trademarkk --out reports/phase31_5
      - name: Persist outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/phase31_5
          if ! git diff --cached --quiet; then
            git commit -m "Persist Phase 31.5 ORB discovery results"
            git push origin HEAD:"${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase31-5-orb-discovery
          path: reports/phase31_5/
