name: Phase 30.8 - No More Straddles source resolution

on:
  workflow_dispatch:
  push:
    branches:
      - phase-30.8-equity-income-no-more-straddles-source-resolution-v1

permissions:
  contents: read

jobs:
  source-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-30.8-equity-income-no-more-straddles-source-resolution-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test runtime
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run source-evidence tests
        run: PYTHONPATH=. python -m pytest -q tests/test_phase30_8_no_more_straddles_resolution.py
      - name: Build deterministic source-resolution report
        run: python research/phase30_8_no_more_straddles_resolution.py --output reports/phase30_8_no_more_straddles_source_resolution.json
      - name: Upload source-resolution report
        uses: actions/upload-artifact@v4
        with:
          name: phase30-8-source-resolution
          path: reports/phase30_8_no_more_straddles_source_resolution.json
