name: Phase 30.3 - Bear Put full transcript and rule resolution

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/phase30-3-run-full.txt"
      - "research/phase30_3_bear_put_full_transcript.py"
      - ".github/workflows/phase-30.3-bear-put-full-transcript.yml"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-30.3-bear-put-full-transcript-resolution-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests==2.34.0
      - name: Extract and archive full caption stream
        run: PYTHONPATH=. python research/phase30_3_bear_put_full_transcript.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          d=json.load(open("reports/phase30_3_bear_put_full_transcript.json"))
          assert d["segment_count"] >= 200
          assert d["transcript_text_sha256"]
          assert d["backtest_allowed"] is False
          print(d["segment_count"], d["transcript_text_sha256"])
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/phase30_3_bear_put_full_transcript.json
          git commit -m "Phase 30.3: archive full Bear Put transcript"
          git push origin HEAD:phase-30.3-bear-put-full-transcript-resolution-v1
