name: Phase 4 - Walk-Forward Selection

on:
  workflow_dispatch:
  push:
    branches:
      - phase-4-walk-forward-selection-v2
    paths:
      - "research/phase4_short_straddle_walk_forward.py"
      - "research/walk_forward.py"
      - ".github/workflows/phase-4-walk-forward-selection-v2.yml"

concurrency:
  group: phase4-walk-forward-selection
  cancel-in-progress: true

jobs:
  walk-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          pip install pandas pyarrow huggingface_hub pytest duckdb numpy

      - name: Unit tests
        run: pytest -q

      - uses: actions/cache@v4
        with:
          path: data/cache/hf_nifty_options
          key: phase3f-artist23-45e0a04-v2

      - name: Acquire or reuse pinned multi-year NIFTY option data
        run: |
          mkdir -p data/cache/hf_nifty_options
          if ! find data/cache/hf_nifty_options -type f -name '*.parquet' -print -quit | grep -q .; then
            python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="artist-23/nifty-options-data", repo_type="dataset", revision="45e0a04", local_dir="data/cache/hf_nifty_options", allow_patterns=["NIFTY/**/*.parquet", "NIFTY/**"])'
          fi
          test -d data/cache/hf_nifty_options/NIFTY

      - name: Run nested walk-forward validation
        run: |
          python -m research.phase4_short_straddle_walk_forward             --data data/cache/hf_nifty_options/NIFTY             --out reports

      - name: Upload Phase 4 reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-walk-forward-results
          path: reports/
