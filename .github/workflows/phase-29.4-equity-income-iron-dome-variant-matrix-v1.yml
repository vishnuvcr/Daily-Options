name: Phase 29.4 - Equity Income Iron Dome variant matrix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/phase29.4-run.txt"
  pull_request:
    paths:
      - ".github/phase29.4-run.txt"
      - "research/phase29_4_variant_matrix.py"
      - "tests/test_phase29_4_variant_matrix.py"
      - ".github/workflows/phase-29.4-equity-income-iron-dome-variant-matrix-v1.yml"

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test tooling
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Unit tests
        run: python -m pytest -q tests/test_phase29_4_variant_matrix.py
      - name: Build frozen variant matrix
        run: python research/phase29_4_variant_matrix.py
      - name: Validate preregistration gate
        run: |
          python - <<'PY'
          import csv, json
          s=json.load(open("reports/phase29_4_summary.json", encoding="utf-8"))
          rows=list(csv.DictReader(open("reports/phase29_4_iron_dome_variant_matrix.csv", newline="", encoding="utf-8")))
          assert s["variant_count"] == 36
          assert len(rows) == 36
          assert s["pnl_allowed"] == 0
          assert s["selection_rule"] == "NONE"
          assert all(r["pnl_allowed"] == "NO" for r in rows)
          print(json.dumps(s, indent=2))
          PY
      - name: Persist matrix
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase29_4_iron_dome_variant_matrix.csv reports/phase29_4_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Phase 29.4: persist preregistered Iron Dome variants"
          git push origin HEAD:${{ github.ref_name }}
