name: Phase 27.2 - Equity Income reconstruction priority

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/phase27-2-trigger.txt"

permissions:
  contents: write

concurrency:
  group: phase27-2-equity-income-priority
  cancel-in-progress: true

jobs:
  prioritize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Phase 27.2 branch
        uses: actions/checkout@v4
        with:
          ref: phase-27.2-equity-income-reconstruction-priority-v1
          fetch-depth: 0
      - name: Sync Phase 27.1 evidence
        run: |
          set -euo pipefail
          git fetch origin phase-27.1-equity-income-context-reconstruction-v1
          git restore --source=origin/phase-27.1-equity-income-context-reconstruction-v1 -- data/equity_income/phase27_1_rule_evidence.jsonl
          test -s data/equity_income/phase27_1_rule_evidence.jsonl
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test tooling
        run: python -m pip install pytest==8.4.2
      - name: Unit tests
        run: python -m pytest -q tests/test_phase27_2_priority.py
      - name: Build priority report
        run: python research/phase27_2_priority.py
      - name: Validate no backtest promotion
        run: |
          python - <<'PY'
          import csv, json
          s=json.load(open("reports/phase27_2_summary.json"))
          rows=list(csv.DictReader(open("reports/phase27_2_reconstruction_priority.csv", newline="", encoding="utf-8")))
          assert len(rows)==71
          assert s["backtest_allowed"]==0
          assert all(r["backtest_allowed"]=="NO" for r in rows)
          print(json.dumps(s, indent=2))
          PY
      - name: Persist priority report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase27_2_reconstruction_priority.csv reports/phase27_2_summary.json data/equity_income/phase27_2_external_evidence.json
          git commit -m "Phase 27.2: persist reconstruction priority"
          git push origin HEAD:phase-27.2-equity-income-reconstruction-priority-v1
