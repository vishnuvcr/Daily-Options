name: Phase 29.4 - Iron Dome rule reconstruction

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/phase29.4-run.txt"
  pull_request:
    paths:
      - ".github/phase29.4-run.txt"
      - "research/phase29_4_iron_dome_rule_reconstruction.py"
      - "tests/test_phase29_4_iron_dome_rule_reconstruction.py"
      - ".github/workflows/phase-29.4-equity-income-iron-dome-rule-reconstruction-v1.yml"

permissions:
  contents: write

concurrency:
  group: phase29.4-equity-income-iron-dome-rule-reconstruction
  cancel-in-progress: false

jobs:
  reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deterministic tooling
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 youtube-transcript-api==1.2.4 huggingface_hub==1.33.0 pyarrow==20.0.0 yt-dlp==2026.8.19 requests==2.34.2

      - name: Unit tests
        run: python -m pytest -q tests/test_phase29_4_iron_dome_rule_reconstruction.py

      - name: Build source-fact ledger
        run: python research/phase29_4_iron_dome_rule_reconstruction.py

      - name: Validate non-P&L gate
        run: |
          python - <<'PY'
          import json
          s=json.load(open("reports/phase29_4_rule_fact_candidates.json", encoding="utf-8"))
          assert s["numerical_backtest_allowed"] == 0
          assert s["phase30_gate"] == "BLOCKED"
          print(json.dumps(s, indent=2))
          PY

      - name: Persist evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase29_4_rule_fact_candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Phase 29.4: persist Iron Dome rule fact ledger"
          TARGET_REF="${{ github.head_ref || github.ref_name }}"
          git push origin HEAD:"$TARGET_REF"
