name: Phase 9 - Regime Credit Spread

on:
  workflow_dispatch:
  push:
    branches:
      - phase-9-regime-credit-spread-v3-memory-safe
    paths:
      - "research/phase9_regime_credit_spread.py"
      - "tests/test_phase9_regime_credit_spread.py"
      - "docs/phase9_hypothesis.md"
      - ".github/workflows/phase-9-regime-credit-spread-v3-memory-safe.yml"
      - "research/cost_model.py"
      - "research/contracts.py"

concurrency:
  group: phase9-regime-credit-spread
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy pyarrow duckdb pytest huggingface_hub
      - name: Unit tests
        run: pytest -q tests/test_phase9_regime_credit_spread.py
      - uses: actions/cache@v4
        with:
          path: data/cache/hf_nifty_options
          key: nifty-options-artist23-45e0a04-v1
          restore-keys: phase3g-artist23-45e0a04-v1
      - name: Acquire or reuse pinned option dataset
        run: |
          mkdir -p data/cache/hf_nifty_options
          if ! find data/cache/hf_nifty_options -type f -name '*.parquet' -print -quit | grep -q .; then
            python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="artist-23/nifty-options-data", repo_type="dataset", revision="45e0a04", local_dir="data/cache/hf_nifty_options", allow_patterns=["NIFTY/**/*.parquet", "NIFTY/**"])'
          fi
          test -d data/cache/hf_nifty_options/NIFTY
      - name: Phase 9 base friction
        run: python -u -m research.phase9_regime_credit_spread --data data/cache/hf_nifty_options/NIFTY --out reports/phase9-base --slippage 0.20
      - name: Phase 9 stress friction
        run: python -m research.phase9_regime_credit_spread --data data/cache/hf_nifty_options/NIFTY --out reports/phase9-stress --slippage 0.40
      - name: Decision summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("reports/phase9-base/phase9_summary.json")
          stress=Path("reports/phase9-stress/phase9_summary.json")
          payload={"base":json.loads(base.read_text()) if base.exists() else {},"stress":json.loads(stress.read_text()) if stress.exists() else {}}
          Path("reports/phase9_decision_summary.json").write_text(json.dumps(payload,indent=2,default=str))
          print(json.dumps(payload,indent=2,default=str))
          PY
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase9-regime-credit-spread
          path: reports/
