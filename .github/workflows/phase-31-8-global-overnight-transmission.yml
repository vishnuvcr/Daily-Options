name: Phase 31.8 Global Overnight Transmission

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/phase31_8-main-launch.txt"

permissions:
  contents: write

concurrency:
  group: phase31-8-global-overnight
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-31.8-global-overnight-transmission-v1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned runtime
        run: |
          python -m pip install --disable-pip-version-check             pandas==2.3.2 numpy==2.1.3 duckdb==1.3.2 pyarrow==19.0.1             pytest==8.4.2 yfinance==0.2.66
      - name: Restore pinned NIFTY/options cache
        uses: actions/cache@v4
        with:
          path: data/cache/phase31_trademarkk
          key: phase31-trademarkk-51ca58c-v1
          restore-keys: phase31-trademarkk-
      - name: Restore global cache
        uses: actions/cache@v4
        with:
          path: data/cache/phase31_8_global
          key: phase31-8-global-yahoo-v1
      - name: Acquire pinned global data if absent
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase31_8_global
          if [ ! -f data/cache/phase31_8_global/manifest.json ]; then
            python - <<'PY'
          import json, time
          from pathlib import Path
          import yfinance as yf
          out=Path("data/cache/phase31_8_global")
          tickers={"GSPC":"^GSPC","IXIC":"^IXIC","N225":"^N225","HSI":"^HSI","GDAXI":"^GDAXI","KS11":"^KS11"}
          manifest={"source":"Yahoo Finance via yfinance","yfinance_version":"0.2.66","retrieved_utc":time.time(),"tickers":{}}
          for k,t in tickers.items():
              df=yf.download(t,start="2020-01-01",end="2026-09-01",auto_adjust=False,progress=False,threads=False)
              if df.empty: raise RuntimeError(f"empty {t}")
              if hasattr(df.columns,"levels"): df.columns=[x[0] if isinstance(x,tuple) else x for x in df.columns]
              df=df.reset_index()[["Date","Close"]].rename(columns={"Date":"date","Close":"close"})
              df.to_parquet(out/f"{k}.parquet",index=False)
              manifest["tickers"][k]={"ticker":t,"rows":len(df),"start":str(df.date.min()),"end":str(df.date.max())}
          (out/"manifest.json").write_text(json.dumps(manifest,indent=2))
          PY
          fi
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase31_8_global_overnight_transmission.py
      - name: Data gate
        run: |
          PYTHONPATH=. python research/phase31_8_global_overnight_transmission.py             --data data/cache/phase31_trademarkk             --global-data data/cache/phase31_8_global             --out reports/phase31_8/gate             --gate-only
      - name: Enforce gate
        run: |
          python - <<'PY'
          import json,sys
          g=json.load(open("reports/phase31_8/gate/data_gate.json"))
          print(json.dumps(g,indent=2))
          sys.exit(0 if g["status"]=="PASS" else 1)
          PY
      - name: Base discovery
        run: |
          PYTHONPATH=. python research/phase31_8_global_overnight_transmission.py             --data data/cache/phase31_trademarkk --global-data data/cache/phase31_8_global             --out reports/phase31_8/base --slippage 0.20
      - name: Stress discovery
        run: |
          PYTHONPATH=. python research/phase31_8_global_overnight_transmission.py             --data data/cache/phase31_trademarkk --global-data data/cache/phase31_8_global             --out reports/phase31_8/stress --slippage 0.40
      - name: Persist artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase31_8 data/cache/phase31_8_global docs/phase31_8_* || true
          if ! git diff --cached --quiet; then
            git commit -m "Phase 31.8: persist global overnight research artifacts"
            git push origin HEAD:phase-31.8-global-overnight-transmission-v1
          fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase31-8-global-overnight
          path: reports/phase31_8
