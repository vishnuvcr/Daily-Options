name: Phase 3F - Option Microstructure

on:
  workflow_dispatch:

concurrency:
  group: phase3f-option-microstructure
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow huggingface_hub
      - uses: actions/cache@v4
        with:
          path: data/cache/hf_nifty_options
          key: phase3f-artist23-nifty-options-v1
      - name: Acquire or reuse cached IV/OI dataset
        run: |
          mkdir -p data/cache/hf_nifty_options
          if ! find data/cache/hf_nifty_options -type f -name '*.parquet' -print -quit | grep -q .; then
            python - <<'PY'
            from huggingface_hub import snapshot_download
            snapshot_download(
                repo_id="artist-23/nifty-options-data",
                repo_type="dataset",
                local_dir="data/cache/hf_nifty_options",
                allow_patterns=["NIFTY/*.parquet", "NIFTY/**/*.parquet"],
            )
            PY
          fi
          find data/cache/hf_nifty_options -type f -name '*.parquet' -print
      - name: Select parquet and audit
        run: |
          f=$(find data/cache/hf_nifty_options -type f -name '*.parquet' | head -1)
          test -n "$f"
          python research/phase3f_option_microstructure.py --data "$f" --out reports/phase3f_data_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3f-data-audit
          path: reports/
