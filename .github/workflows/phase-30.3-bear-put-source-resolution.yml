name: Phase 30.3 - Equity Income Bear Put source resolution

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/phase30-3-run.txt"

permissions:
  contents: write

concurrency:
  group: phase30-3-bear-put-source-resolution
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-30.3-equity-income-bear-put-source-resolution-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tooling
        run: python -m pip install --disable-pip-version-check requests==2.34.0 pytest==8.4.2

      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase30_3_bear_put_source_resolution.py

      - name: Extract contextual evidence
        run: PYTHONPATH=. python research/phase30_3_bear_put_source_resolution.py

      - name: Validate evidence
        run: |
          python - <<'PY'
          import json
          data = json.load(open("reports/phase30_3_bear_put_source_contexts.json"))
          assert data["video_id"] == "IpCuGEDxF1k"
          assert data["backtest_allowed"] is False
          assert data["segment_count"] > 0
          assert data["transcript_text_sha256"]
          assert len(data["contexts"]) == 15
          print({k: len(v) for k, v in data["contexts"].items()})
          PY

      - name: Persist evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/phase30_3_bear_put_source_contexts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Phase 30.3: persist Bear Put source evidence"
          git push origin HEAD:phase-30.3-equity-income-bear-put-source-resolution-v1
