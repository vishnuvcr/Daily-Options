name: Phase 30.7 - Bear Put weekly numerical research

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/phase30-7-run.txt"
      - "research/phase30_7_bear_put_weekly.py"
      - "tests/test_phase30_7_bear_put_weekly.py"
      - ".github/workflows/phase-30.7-bear-put-weekly.yml"

permissions:
  contents: write

concurrency:
  group: phase30-7-bear-put-weekly
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: phase-30.7-bear-put-weekly-research-v1
          fetch-depth: 0

      - name: Restore / acquire pinned Rissin option data
        uses: actions/cache@v4
        with:
          path: data/cache/phase30_2_rissin
          key: phase30-2-rissin-nifty-8f7739c-2025-2026-v1

      - name: Acquire exact Rissin snapshot if cache is absent
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase30_2_rissin
          python -m pip install --disable-pip-version-check huggingface_hub==0.34.4
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          repo_id="rissin/nse-options-intraday"
          revision="8f7739cab3f38abdcbc6332a6d0a83e1341326e3"
          out=Path("data/cache/phase30_2_rissin")
          for year in ("2025","2026"):
              target=out/f"NIFTY_{year}.parquet"
              if not target.exists():
                  p=hf_hub_download(repo_id=repo_id,filename=f"upstox_intraday/NIFTY/NIFTY_{year}.parquet",repo_type="dataset",revision=revision,local_dir=str(out))
                  Path(p).replace(target) if Path(p)!=target else None
          PY

      - name: Checkout pinned NIFTY spot source
        uses: actions/checkout@v4
        with:
          repository: technovusin/nifty50-historical-data
          ref: 75f273a2dec36b10f4ded3a00721fae2172edccb
          path: external/nifty50-historical-data
          fetch-depth: 1

      - name: Stage spot input
        run: |
          set -euo pipefail
          rm -rf data/cache/phase30_5_nifty_spot
          mkdir -p data/cache/phase30_5_nifty_spot
          find external/nifty50-historical-data/1min/2025 external/nifty50-historical-data/1min/2026 -type f -name "*.csv" -print0 | while IFS= read -r -d '' f; do
            cp "$f" "data/cache/phase30_5_nifty_spot/$(basename "$f")"
          done

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          python -m pip install --disable-pip-version-check             pandas==2.3.2             numpy==2.2.6             duckdb==1.4.0             pytest==8.4.2

      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase30_7_bear_put_weekly.py

      - name: Run Base + Stress
        run: PYTHONPATH=. python research/phase30_7_bear_put_weekly.py

      - name: Persist result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase30_7_bear_put/phase30_7_bear_put_result.json
          if ! git diff --cached --quiet; then
            git commit -m "Phase 30.7: persist Bear Put Base and Stress result"
            git push origin HEAD:phase-30.7-bear-put-weekly-research-v1
          fi

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: phase30-7-bear-put-result
          path: reports/phase30_7_bear_put/phase30_7_bear_put_result.json
