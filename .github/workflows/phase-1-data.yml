name: Phase 1 - Data Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - phase-3g-oi-confirmed-breakout
    paths:
      - "research/phase3g_oi_confirmed_breakout.py"
      - "scripts/run_phase3g_ci.sh"
      - ".github/workflows/phase-1-data.yml"
      - "tests/test_phase3g_oi_confirmed_breakout.py"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: pip install pandas pyarrow openpyxl pytest pyyaml duckdb huggingface_hub

      - name: Create research directories
        run: mkdir -p data/raw data/cache reports

      - name: Run unit tests
        run: pytest -q

      - uses: actions/cache@v4
        with:
          path: data/cache/hf_nifty_options
          key: phase3g-artist23-45e0a04-v1

      - name: Run Phase 3G bounded research
        run: bash scripts/run_phase3g_ci.sh

      - name: Upload Phase 3G reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3g-bridge-results
          path: reports/
