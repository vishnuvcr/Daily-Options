name: Phase 19 - NIFTY Short Strangle Regime v3 Authoritative

on:
  workflow_dispatch:
  push:
    branches: [phase-19-nifty-short-strangle-regime-v3-authoritative]

concurrency:
  group: phase19-short-strangle-v3-authoritative
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-19-nifty-short-strangle-regime-v3-authoritative

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy pyarrow duckdb huggingface_hub pytest

      - name: Unit tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_phase19_nifty_short_strangle_regime.py \
            tests/test_phase19_nifty_short_strangle_regime_v2.py

      - name: Cache exact-expiry data
        uses: actions/cache@v4
        with:
          path: data/cache/phase19_trademarkk
          key: phase19-trademarkk-51ca58c-v1
          restore-keys: |
            phase17-trademarkk-51ca58c-v1
            phase17-trademarkk-

      - name: Acquire or reuse data
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase19_trademarkk
          if [ ! -f data/cache/phase19_trademarkk/index/NIFTY.parquet ]; then
            for attempt in 1 2 3 4; do
              python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m",repo_type="dataset",revision="51ca58c",local_dir="data/cache/phase19_trademarkk",allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"])' && break
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep $((attempt*15))
            done
          fi

      - name: Clean report directories
        run: |
          rm -rf reports/phase19_v3
          mkdir -p reports/phase19_v3/base reports/phase19_v3/stress

      - name: Base friction
        run: |
          PYTHONPATH=. python -m research.phase19_nifty_short_strangle_regime_v2 \
            --data data/cache/phase19_trademarkk \
            --out reports/phase19_v3/base \
            --slippage 0.20

      - name: Stress friction
        run: |
          PYTHONPATH=. python -m research.phase19_nifty_short_strangle_regime_v2 \
            --data data/cache/phase19_trademarkk \
            --out reports/phase19_v3/stress \
            --slippage 0.40

      - name: Build combined evidence manifest
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("reports/phase19_v3")
          out = {}
          for label in ("base", "stress"):
              p = root / label / "phase19_summary.json"
              if p.exists():
                  out[label] = json.loads(p.read_text())
          (root / "evidence_manifest.json").write_text(json.dumps(out, indent=2, default=str))
          PY

      - name: Upload Phase 19 v3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase19-v3-authoritative-evidence
          path: reports/phase19_v3/

# authoritative rerun trigger
