name: Phase 27.5 - T1 source-resolution matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/phase27-5-trigger.txt"

permissions:
  contents: write

concurrency:
  group: phase27-5-equity-income-resolution
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Phase 27.5 branch
        uses: actions/checkout@v4
        with:
          ref: phase-27.5-equity-income-t1-resolution-matrix-v1
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test tooling
        run: python -m pip install pytest==8.4.2
      - name: Unit tests
        run: python -m pytest -q tests/test_phase27_5_matrix.py
      - name: Validate matrix
        run: python research/phase27_5_matrix.py
      - name: Check hard gate
        run: |
          python - <<'PY'
          import json
          s=json.load(open('reports/phase27_5_summary.json'))
          assert s['t1_candidates']==8
          assert s['backtest_ready']==0
          assert s['blocked']==8
          print(json.dumps(s,indent=2))
          PY
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/phase27_5_t1_resolution_matrix.csv reports/phase27_5_t1_resolution_matrix.json reports/phase27_5_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Phase 27.5: persist T1 source-resolution matrix"
          git push origin HEAD:phase-27.5-equity-income-t1-resolution-matrix-v1
