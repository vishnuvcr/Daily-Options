name: Phase 31 - Regime robustness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-31-equity-income-regime-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Phase definition
        run: |
          echo "Phase 31: Regime robustness"
          echo "Manual execution branch: phase-31-equity-income-regime-v1"
          echo "Weekly target: INR 5,000 net per traded week at fixed reference sizing"
          echo "Scope: Segment by India VIX, trend/range, gap, expiry distance, global volatility and other applicable variables."
