name: Phase 13b - Frozen OOS 2021-2025

on:
  workflow_dispatch:
  push:
    branches:
      - phase-13b-frozen-oos-2021-2025

concurrency:
  group: phase13b-frozen-oos
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow duckdb pytest huggingface_hub
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase13b_frozen_oos.py
      - name: Prepare cache
        uses: actions/cache@v4
        with:
          path: data/cache/phase13b_artist23
          key: phase13b-artist23-nifty-v1
      - name: Acquire pinned later-period dataset
        run: |
          mkdir -p data/cache/phase13b_artist23
          if [ ! -d data/cache/phase13b_artist23/NIFTY ]; then
            python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='artist-23/nifty-options-data', repo_type='dataset', local_dir='data/cache/phase13b_artist23', allow_patterns=['NIFTY/*.parquet'])"
          fi
          find data/cache/phase13b_artist23/NIFTY -type f -name '*.parquet' -print | sed -n '1,20p'
      - name: Base frozen validation
        run: PYTHONPATH=. python -m research.phase13b_frozen_oos --root data/cache/phase13b_artist23 --out reports/phase13b-base --slippage 0.20
      - name: Stress frozen validation
        run: PYTHONPATH=. python -m research.phase13b_frozen_oos --root data/cache/phase13b_artist23 --out reports/phase13b-stress --slippage 0.40
      - name: Decision
        if: always()
        run: |
          mkdir -p reports
          python - <<PY
          import json
          from pathlib import Path
          payload = {
              'base': json.loads(Path('reports/phase13b-base/phase13b_decision.json').read_text()) if Path('reports/phase13b-base/phase13b_decision.json').exists() else {},
              'stress': json.loads(Path('reports/phase13b-stress/phase13b_decision.json').read_text()) if Path('reports/phase13b-stress/phase13b_decision.json').exists() else {},
          }
          Path('reports/phase13b_decision_summary.json').write_text(json.dumps(payload, indent=2, default=str))
          print(json.dumps(payload, indent=2, default=str))
          PY
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase13b-frozen-oos-2021-2025
          path: reports/