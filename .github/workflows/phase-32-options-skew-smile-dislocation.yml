name: Phase 32 options skew smile dislocation

on:
  push:
    paths:
      - ".github/phase32-main-launch.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase32-options-skew-smile
  cancel-in-progress: false

jobs:
  phase32:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-32-options-skew-smile-dislocation-v1
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --disable-pip-version-check             pandas==2.3.2 numpy==2.1.3 duckdb==1.3.2 pyarrow==19.0.1             pytest==8.4.2 matplotlib==3.10.6 requests==2.32.5 curl_cffi==0.13.0             huggingface_hub==0.36.0

      - name: Verify checked-out Phase 32 source
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          grep -n "local_time" research/phase32_options_skew_smile_dislocation.py
          if grep -n "strftime(CAST(timestamp AS TIMESTAMP),'%H:%M:%S') time," research/phase32_options_skew_smile_dislocation.py; then
            echo "STALE_TIME_ALIAS_PRESENT"
            exit 1
          fi

      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase32_options_skew_smile_dislocation.py

      - name: Restore pinned NIFTY/options cache
        uses: actions/cache@v4
        with:
          path: data/cache/phase31_trademarkk
          key: phase31-trademarkk-51ca58c-v1
          restore-keys: |
            phase31-trademarkk-51ca58c-
            phase30-trademarkk-51ca58c-

      - name: Acquire or reuse pinned NIFTY/options source
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase31_trademarkk
          if [ ! -f data/cache/phase31_trademarkk/index/NIFTY.parquet ]; then
            python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m",repo_type="dataset",revision="51ca58c",local_dir="data/cache/phase31_trademarkk",allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"])'
          fi

      - name: Run data gate
        run: |
          PYTHONPATH=. python research/phase32_options_skew_smile_dislocation.py             --data data/cache/phase31_trademarkk             --out reports/phase32/gate             --gate-only

      - name: Run Base discovery
        run: |
          if python -c 'import json,sys; g=json.load(open("reports/phase32/gate/data_gate.json")); sys.exit(0 if g["status"]=="PASS" else 1)'; then
            PYTHONPATH=. python research/phase32_options_skew_smile_dislocation.py               --data data/cache/phase31_trademarkk               --out reports/phase32/base               --slippage 0.20
          else
            echo "DATA_GATE_FAIL: numerical stage intentionally skipped"
          fi

      - name: Run Stress discovery
        run: |
          if python -c 'import json,sys; g=json.load(open("reports/phase32/gate/data_gate.json")); sys.exit(0 if g["status"]=="PASS" else 1)'; then
            PYTHONPATH=. python research/phase32_options_skew_smile_dislocation.py               --data data/cache/phase31_trademarkk               --out reports/phase32/stress               --slippage 0.40
          else
            echo "DATA_GATE_FAIL: numerical stage intentionally skipped"
          fi

      - name: Validate Phase 32 artifacts
        run: |
          python - <<'PY'
          import json, pathlib, pandas as pd
          g=json.load(open("reports/phase32/gate/data_gate.json"))
          if g["status"]=="PASS":
              for fr in ("base","stress"):
                  s=pd.read_csv(f"reports/phase32/{fr}/true_cell_summary_{fr}.csv")
                  assert len(s)==12,(fr,len(s))
                  assert set(s.friction)=={fr}
                  n=pd.read_csv(f"reports/phase32/{fr}/null_summary_{fr}.csv")
                  assert len(n)==60,(fr,len(n))
                  cov=pd.read_csv(f"reports/phase32/{fr}/price_coverage.csv")
                  assert len(cov)==12,(fr,len(cov))
                  assert cov.coverage_rate.min()>=0.95,(fr,"coverage below 95%")
                  t=pd.read_csv(f"reports/phase32/{fr}/trades_{fr}.csv")
                  assert len(t)>0,(fr,"zero trades")
          PY

      - name: Persist Phase 32 reports
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports/phase32
          git add -f reports/phase32
          if ! git diff --cached --quiet; then
            git commit -m "Phase 32: persist options surface discovery outputs"
            for attempt in 1 2 3; do
              if git push origin HEAD:phase-32-options-skew-smile-dislocation-v1; then exit 0; fi
              git fetch origin phase-32-options-skew-smile-dislocation-v1
              git rebase FETCH_HEAD
            done
            exit 1
          fi

      - name: Upload Phase 32 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase32-options-skew-smile
          path: reports/phase32
