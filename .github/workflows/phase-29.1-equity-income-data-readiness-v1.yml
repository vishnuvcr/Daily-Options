name: Phase 29.1 - Equity Income data readiness

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/phase29.1-run.txt"
  pull_request:
    paths:
      - ".github/phase29.1-run.txt"
      - "research/phase29_readiness.py"
      - "tests/test_phase29_readiness.py"
      - ".github/workflows/phase-29.1-equity-income-data-readiness-v1.yml"

permissions:
  contents: write

concurrency:
  group: phase29.1-equity-income-data-readiness
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current readiness branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Sync Phase 28 candidate registry
        run: |
          set -euo pipefail
          git fetch origin phase-28-equity-income-dedup-v1
          git show origin/phase-28-equity-income-dedup-v1:data/equity_income/strategy_families.csv > data/equity_income/strategy_families.csv
          test -s data/equity_income/strategy_families.csv

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: python -m pip install --disable-pip-version-check pytest==8.4.2

      - name: Unit tests
        run: python -m pytest -q tests/test_phase29_readiness.py

      - name: Build source-readiness audit
        run: python research/phase29_readiness.py

      - name: Validate readiness gate
        run: |
          python - <<'PY'
          import csv, json
          s = json.load(open("reports/phase29_readiness_summary.json", encoding="utf-8"))
          inv = json.load(open("data/equity_income/phase29_readiness_source_inventory.json", encoding="utf-8"))
          rows = list(csv.DictReader(open("reports/phase29_readiness_matrix.csv", newline="", encoding="utf-8")))
          assert s["candidate_members"] == 71
          assert len(rows) == 71
          assert s["preliminary_feasible"] == 51
          assert s["data_limited"] == 16
          assert s["unresolved"] == 4
          assert s["backtest_allowed"] == 0
          assert s["bid_ask_verified"] == 0
          assert s["strategy_specific_quote_completeness_verified"] == 0
          assert s["historical_lot_size_fully_verified"] == 0
          assert inv["trademarkk"]["api_status"] == "OK"
          assert inv["rissin"]["api_status"] == "OK"
          assert inv["trademarkk"]["paths"]["options/NIFTY"]["file_count"] > 0
          assert inv["rissin"]["paths"]["upstox_intraday/NIFTY"]["file_count"] > 0
          assert all(r["backtest_allowed"] == "NO" for r in rows)
          print(json.dumps(s, indent=2))
          PY

      - name: Persist Phase 29.1 evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase29_readiness_matrix.csv reports/phase29_readiness_summary.json data/equity_income/phase29_readiness_source_inventory.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Phase 29.1: persist source readiness audit"
          git push origin HEAD:${{ github.ref_name }}
