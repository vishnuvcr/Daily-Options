name: Phase 24 - Falcon Spread backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/phase24_plan.md"
      - "research/phase24_falcon_spread.py"
      - "tests/test_phase24_falcon_spread.py"
      - ".github/workflows/phase-24-falcon-spread-backtest.yml"

concurrency:
  group: phase24-falcon-spread-v1
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        friction: [base, stress]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-24-falcon-spread-backtest-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy duckdb pyarrow huggingface_hub pytest
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase24_falcon_spread.py
      - name: Cache exact-expiry NIFTY data
        uses: actions/cache@v4
        with:
          path: data/cache/phase24_trademarkk
          key: phase24-trademarkk-51ca58c-v1
          restore-keys: |
            phase17-trademarkk-51ca58c-v1
            phase18-trademarkk-
            phase19-trademarkk-
      - name: Acquire or reuse exact-expiry NIFTY data
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase24_trademarkk
          if [ ! -f data/cache/phase24_trademarkk/index/NIFTY.parquet ]; then
            for attempt in 1 2 3 4; do
              python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m",repo_type="dataset",revision="51ca58c",local_dir="data/cache/phase24_trademarkk",allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"])' && break
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep $((attempt*15))
            done
          fi
          test -f data/cache/phase24_trademarkk/index/NIFTY.parquet
          test -d data/cache/phase24_trademarkk/options/NIFTY
      - name: Run friction
        env:
          SLIP: ${{ matrix.friction == 'base' && '0.20' || '0.40' }}
          LABEL: ${{ matrix.friction }}
        run: |
          PYTHONPATH=. python -m research.phase24_falcon_spread \
            --data data/cache/phase24_trademarkk \
            --out reports/${LABEL} \
            --slippage "${SLIP}"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase24-falcon-${{ matrix.friction }}
          path: reports/