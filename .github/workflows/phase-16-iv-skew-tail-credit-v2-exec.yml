name: Phase 16 - IV Skew Tail Credit v2

on:
  workflow_dispatch:
  push:
    branches: [phase-16-iv-skew-tail-credit-v2-exec]

concurrency:
  group: phase16-skew-v2
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        expiry: [WEEK, MONTH]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "phase-16-iv-skew-tail-credit-v2-exec"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy pyarrow duckdb huggingface_hub pytest
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase16_iv_skew_tail_credit.py
      - name: Cache Artist23
        uses: actions/cache@v4
        with:
          path: data/cache/hf_nifty_options
          key: phase16-artist23-45e0a04-v4
      - name: Acquire or reuse dataset
        run: |
          set -euo pipefail
          mkdir -p data/cache/hf_nifty_options
          if ! find data/cache/hf_nifty_options -type f -name '*.parquet' -print -quit | grep -q .; then
            for attempt in 1 2 3 4; do
              python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='artist-23/nifty-options-data',repo_type='dataset',revision='45e0a04',local_dir='data/cache/hf_nifty_options',allow_patterns=['NIFTY/**/*.parquet'])" && break
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep $((attempt*15))
            done
          fi
      - name: Base friction
        run: PYTHONPATH=. python -m research.phase16_iv_skew_tail_credit --data data/cache/hf_nifty_options/NIFTY --out reports/${{ matrix.expiry }}/base --slippage 0.20 --expiry-type ${{ matrix.expiry }}
      - name: Stress friction
        run: PYTHONPATH=. python -m research.phase16_iv_skew_tail_credit --data data/cache/hf_nifty_options/NIFTY --out reports/${{ matrix.expiry }}/stress --slippage 0.40 --expiry-type ${{ matrix.expiry }}
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase16-v2-${{ matrix.expiry }}
          path: reports/
