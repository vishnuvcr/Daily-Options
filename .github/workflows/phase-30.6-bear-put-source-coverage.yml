name: Phase 30.6 - Bear Put source interpretation coverage
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/phase30-6-run.txt"
      - "research/phase30_6_bear_put_signal_coverage.py"
      - ".github/workflows/phase-30.6-bear-put-source-coverage.yml"
permissions:
  contents: write
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-30.6-bear-put-source-interpretation-coverage-v1
      - uses: actions/checkout@v4
        with:
          repository: technovusin/nifty50-historical-data
          ref: 75f273a2dec36b10f4ded3a00721fae2172edccb
          path: external/nifty50-historical-data
          fetch-depth: 1
      - name: Stage spot source
        run: |
          rm -rf data/cache/phase30_5_nifty_spot
          mkdir -p data/cache/phase30_5_nifty_spot
          find external/nifty50-historical-data/1min/2025 external/nifty50-historical-data/1min/2026 -type f -name "*.csv" -print0 | while IFS= read -r -d '' f; do cp "$f" "data/cache/phase30_5_nifty_spot/$(basename "$f")"; done
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check pandas==2.3.2
      - run: PYTHONPATH=. python research/phase30_6_bear_put_signal_coverage.py
      - name: Persist coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase30_6_bear_put_signal_coverage.json
          git commit -m "Phase 30.6: persist Bear Put signal coverage"
          git push origin HEAD:phase-30.6-bear-put-source-interpretation-coverage-v1
