name: Phase 30.5 - Bear Put NIFTY spot data validation
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/phase30-5-run.txt"
      - "research/phase30_5_nifty_spot_validation.py"
      - ".github/workflows/phase-30.5-bear-put-spot-validation.yml"
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-30.5-bear-put-spot-data-validation-v1
      - uses: actions/checkout@v4
        with:
          repository: technovusin/nifty50-historical-data
          ref: 75f273a2dec36b10f4ded3a00721fae2172edccb
          path: external/nifty50-historical-data
          fetch-depth: 1
      - name: Stage 1-minute spot data
        run: |
          set -euo pipefail
          rm -rf data/cache/phase30_5_nifty_spot
          mkdir -p data/cache/phase30_5_nifty_spot
          find external/nifty50-historical-data/1min/2025 external/nifty50-historical-data/1min/2026 -type f -name "*.csv" -print0 | while IFS= read -r -d '' f; do
            cp "$f" "data/cache/phase30_5_nifty_spot/$(basename "$f")"
          done
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check pandas==2.3.2
      - name: Validate
        run: PYTHONPATH=. python research/phase30_5_nifty_spot_validation.py
      - name: Persist manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase30_5_nifty_spot_validation.json
          git commit -m "Phase 30.5: persist NIFTY spot data validation"
          git push origin HEAD:phase-30.5-bear-put-spot-data-validation-v1
      - name: Upload cached spot files
        uses: actions/upload-artifact@v4
        with:
          name: phase30-5-nifty-spot-data
          path: data/cache/phase30_5_nifty_spot
