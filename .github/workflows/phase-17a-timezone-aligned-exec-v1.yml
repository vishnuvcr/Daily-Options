name: Phase 17a - Timezone Aligned Exact-Expiry Tournament

on:
  workflow_dispatch:
  push:
    branches: [phase-17a-timezone-aligned-exec-v1]

concurrency:
  group: phase17a-timezone-exec
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        friction: [base, stress]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "phase-17a-timezone-aligned-exec-v1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy pyarrow duckdb huggingface_hub pytest
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase17_nifty_exact_expiry_premium_skew.py
      - name: Cache TradeMarkk NIFTY data
        uses: actions/cache@v4
        with:
          path: data/cache/phase17_trademarkk
          key: phase17-trademarkk-51ca58c-v1
      - name: Acquire or reuse exact-expiry NIFTY data
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase17_trademarkk
          if [ ! -f data/cache/phase17_trademarkk/index/NIFTY.parquet ]; then
            for attempt in 1 2 3 4; do
              python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m",repo_type="dataset",revision="51ca58c",local_dir="data/cache/phase17_trademarkk",allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"])' && break
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep $((attempt*15))
            done
          fi
      - name: Run selected friction
        env:
          SLIP: \${{ matrix.friction == 'base' && '0.20' || '0.40' }}
          LABEL: \${{ matrix.friction }}
        run: |
          PYTHONPATH=. python -m research.phase17_nifty_exact_expiry_premium_skew \
            --data data/cache/phase17_trademarkk \
            --out reports/$LABEL \
            --slippage "$SLIP"
      - name: Print summary
        if: always()
        run: |
          if [ -f reports/$LABEL/phase17_summary.json ]; then cat reports/$LABEL/phase17_summary.json; fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase17a-\${{ matrix.friction }}
          path: reports/
