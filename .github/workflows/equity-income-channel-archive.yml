name: Equity Income - channel archive (keyless)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: equity-income-channel-archive-keyless
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout fixed archive branch
        uses: actions/checkout@v4
        with:
          ref: equity-income-channel-archive-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install archive tooling
        run: python -m pip install -r requirements-equity-income-archive.txt

      - name: Start YouTube PO-token provider
        run: |
          set -euo pipefail
          docker pull brainicism/bgutil-ytdlp-pot-provider:2.0.0
          docker run --name bgutil-provider --rm -d --init             -p 127.0.0.1:4416:4416             brainicism/bgutil-ytdlp-pot-provider:2.0.0
          python - <<'PY'
          import socket
          import time
          for _ in range(30):
              try:
                  with socket.create_connection(("127.0.0.1", 4416), timeout=1):
                      print("bgutil provider is listening")
                      raise SystemExit(0)
              except OSError:
                  time.sleep(1)
          raise SystemExit("bgutil provider did not become ready")
          PY

      - name: Verify archive public key
        run: |
          set -euo pipefail
          test -s config/equity_income_archive_public_key.pem
          sha256sum config/equity_income_archive_public_key.pem

      - name: Run Python archive
        id: archive
        continue-on-error: true
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/archive_equity_income_keyless.py             --channel-url "https://www.youtube.com/@equityincome"             --output-root "data/equity_income"             --public-key "config/equity_income_archive_public_key.pem"             --transcript-timeout-seconds 20             --workers 2

      - name: Test archive tooling
        if: always()
        continue-on-error: true
        run: PYTHONPATH=. pytest -q tests/test_equity_income_archive.py

      - name: Commit archive progress even when incomplete
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/equity_income
          if git diff --cached --quiet; then
            echo "No archive changes."
            exit 0
          fi
          git commit -m "Archive Equity Income channel metadata and transcripts"
          git push origin HEAD:equity-income-channel-archive-v1

      - name: Enforce archive completeness
        if: steps.archive.outcome == 'failure'
        run: |
          echo "::error::Equity Income archive is incomplete. Partial encrypted successes were committed for resumable continuation."
          exit 2
