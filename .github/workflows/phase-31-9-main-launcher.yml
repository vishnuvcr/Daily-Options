name: Phase 31.9 main launcher

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/phase31_9-main-launch.txt"

permissions:
  contents: write

concurrency:
  group: phase31-9-main-launcher
  cancel-in-progress: false

jobs:
  phase31_9:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-31.9-vix-rv-gap-opening-direction-v1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned runtime
        run: |
          python -m pip install --disable-pip-version-check             pandas==2.3.2 numpy==2.1.3 duckdb==1.3.2 pyarrow==19.0.1             pytest==8.4.2 requests==2.32.5 huggingface_hub==0.34.4
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase31_9_vix_rv_gap_opening.py
      - name: Restore pinned NIFTY cache
        uses: actions/cache@v4
        with:
          path: data/cache/phase31_trademarkk
          key: phase31-trademarkk-51ca58c-v1
          restore-keys: |
            phase31-trademarkk-51ca58c-
            phase30-trademarkk-51ca58c-
      - name: Acquire or reuse exact-expiry NIFTY source
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase31_trademarkk
          if [ ! -s data/cache/phase31_trademarkk/index/NIFTY.parquet ]; then
            python - <<'PY'
            from huggingface_hub import snapshot_download
            snapshot_download(
                repo_id="thetrademarkk/india-index-options-1m",
                repo_type="dataset",
                revision="51ca58c",
                local_dir="data/cache/phase31_trademarkk",
                allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"],
            )
            PY
          fi
          test -s data/cache/phase31_trademarkk/index/NIFTY.parquet
      - name: Restore India VIX cache
        uses: actions/cache@v4
        with:
          path: data/cache/phase31_9_india_vix
          key: phase31-9-india-vix-2021-07-01-2026-08-31-v1
      - name: Acquire or reuse official NSE India VIX
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase31_9_india_vix reports/phase31_9/gate
          if [ ! -s data/cache/phase31_9_india_vix/india_vix.csv ]; then
            PYTHONPATH=. python research/phase31_9_acquire_vix.py               --start 2021-07-01               --end 2026-08-31               --output data/cache/phase31_9_india_vix/india_vix.csv               --metadata data/cache/phase31_9_india_vix/manifest.json
          fi
          test -s data/cache/phase31_9_india_vix/india_vix.csv
          test -s data/cache/phase31_9_india_vix/manifest.json
      - name: Run Phase 31.9 data gate
        run: |
          PYTHONPATH=. python research/phase31_9_vix_rv_gap_opening.py             --data data/cache/phase31_trademarkk             --vix data/cache/phase31_9_india_vix             --out reports/phase31_9/gate             --gate-only
      - name: Run Base discovery
        run: |
          if python -c 'import json,sys; g=json.load(open("reports/phase31_9/gate/data_gate.json")); sys.exit(0 if g["status"]=="PASS" else 1)'; then
            PYTHONPATH=. python research/phase31_9_vix_rv_gap_opening.py               --data data/cache/phase31_trademarkk               --vix data/cache/phase31_9_india_vix               --out reports/phase31_9/base               --slippage 0.20
          else
            echo "VIX_RV_DATA_GATE_FAIL: Base intentionally skipped"
          fi
      - name: Run Stress discovery
        run: |
          if python -c 'import json,sys; g=json.load(open("reports/phase31_9/gate/data_gate.json")); sys.exit(0 if g["status"]=="PASS" else 1)'; then
            PYTHONPATH=. python research/phase31_9_vix_rv_gap_opening.py               --data data/cache/phase31_trademarkk               --vix data/cache/phase31_9_india_vix               --out reports/phase31_9/stress               --slippage 0.40
          else
            echo "VIX_RV_DATA_GATE_FAIL: Stress intentionally skipped"
          fi
      - name: Validate numerical artifacts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pandas as pd
          g=json.load(open("reports/phase31_9/gate/data_gate.json"))
          if g["status"]=="PASS":
              for regime in ["base","stress"]:
                  x=pd.read_csv(f"reports/phase31_9/{regime}/true_cell_summary_{regime}.csv")
                  assert len(x)==12, (regime,len(x))
                  t=pd.read_csv(f"reports/phase31_9/{regime}/trades_{regime}.csv")
                  assert len(t)>0, (regime,"zero trades")
                  assert (t.net_pnl-(t.raw_gross-t.slippage_cost-t.transaction_costs)).abs().max()<1e-6
                  n=pd.read_csv(f"reports/phase31_9/{regime}/null_summary_{regime}.csv")
                  assert len(n)==60, (regime,len(n))
                  p=pd.read_csv("reports/phase31_9/gate/data_gate.json") if False else pd.read_csv(f"reports/phase31_9/{regime}/price_coverage.csv")
                  assert len(p)==12, (regime,len(p))
                  assert (p.coverage_rate>=0.95).all(), (regime,p[p.coverage_rate<0.95].to_dict("records"))
          PY
      - name: Persist cache and reports to phase branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/phase31_9 data/cache/phase31_9_india_vix
          if ! git diff --cached --quiet; then
            git commit -m "Phase 31.9: persist VIX-RV opening-gap outputs"
            for attempt in 1 2 3; do
              if git push origin HEAD:phase-31.9-vix-rv-gap-opening-direction-v1; then exit 0; fi
              git fetch origin phase-31.9-vix-rv-gap-opening-direction-v1
              git rebase FETCH_HEAD
            done
            exit 1
          fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase31-9-vix-rv-gap-opening
          path: |
            reports/phase31_9/
            data/cache/phase31_9_india_vix/
