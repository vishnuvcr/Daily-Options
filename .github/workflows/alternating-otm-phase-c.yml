name: Strategy — Alternating OTM Phase C Tail Filter

on:
  workflow_dispatch:
  push:
    branches:
      - research/alternating-otm-phase-c-tail-filter-v1
    paths:
      - research/alternating_otm_phase_c_tail_filter.py
      - docs/alternating_otm_phase_c_plan.md
      - docs/alternating_otm_phase_c_artifact_manifest.md
      - .github/workflows/alternating-otm-phase-c.yml

permissions:
  contents: read
  actions: read

jobs:
  phase-c:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/alternating-otm-phase-c-tail-filter-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Download immutable baseline artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/base artifacts/stress
          gh run download 36535251511 -n strategy-alternating-otm12-base -D artifacts/base
          gh run download 36535251511 -n strategy-alternating-otm12-stress -D artifacts/stress
          test -s artifacts/base/trades.csv
          test -s artifacts/stress/trades.csv
          echo "Base bytes: $(stat -c%s artifacts/base/trades.csv)"
          echo "Stress bytes: $(stat -c%s artifacts/stress/trades.csv)"

      - name: Verify artifact digests
        run: |
          set -euo pipefail
          find artifacts -type f -print0 | sort -z | xargs -0 sha256sum > artifact_sha256_actual.txt
          grep 'artifacts/base/trades.csv' artifact_sha256_actual.txt || true
          grep 'artifacts/stress/trades.csv' artifact_sha256_actual.txt || true

      - name: Run preregistered Phase C
        run: |
          PYTHONPATH=. python research/alternating_otm_phase_c_tail_filter.py             --base-artifact artifacts/base             --stress-artifact artifacts/stress             --out reports/alternating-otm-phase-c

      - name: Upload Phase C results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alternating-otm-phase-c-results
          path: |
            reports/alternating-otm-phase-c
            artifact_sha256_actual.txt
