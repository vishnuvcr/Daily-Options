name: Phase 30.7 - Bear Put contract audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase30-7-bear-put-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout frozen Phase 30.7 branch
        uses: actions/checkout@v4
        with:
          ref: phase-30.7-bear-put-contract-interpretation-grid-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas duckdb pyarrow huggingface_hub

      - name: Restore Rissin NIFTY cache
        uses: actions/cache@v4
        with:
          path: data/cache/phase30_2_rissin
          key: phase30-2-rissin-nifty-runtime-resolved-v1

      - name: Acquire pinned NIFTY option files
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase30_2_rissin
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          repo_id="rissin/nse-options-intraday"
          revision="78b1c5468255d18cf492984bfe6fe4e3ac874d7c"
          out=Path("data/cache/phase30_2_rissin")
          for year in ("2025","2026"):
              target=out/f"NIFTY_{year}.parquet"
              if not target.exists():
                  p=hf_hub_download(repo_id=repo_id,
                                    filename=f"upstox_intraday/NIFTY/NIFTY_{year}.parquet",
                                    repo_type="dataset",revision=revision,
                                    local_dir=str(out))
                  p=Path(p)
                  if p != target:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      p.replace(target)
          PY

      - name: Rebuild Phase 30.6 coverage if needed
        run: |
          test -s reports/phase30_6_bear_put_signal_coverage.json || PYTHONPATH=. python research/phase30_6_bear_put_signal_coverage.py

      - name: Run deterministic contract audit
        run: PYTHONPATH=. python research/phase30_7_bear_put_contract_audit.py

      - name: Persist audit and status
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/phase30_7_bear_put_contract_audit.json reports/phase30_6_bear_put_signal_coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Phase 30.7: persist Bear Put contract audit"
            git push origin HEAD:phase-30.7-bear-put-contract-interpretation-grid-v1
          fi

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase30-7-bear-put-contract-audit
          path: reports/phase30_7_bear_put_contract_audit.json
