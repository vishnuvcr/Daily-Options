name: Phase 30.13 - Low VIX diagonal source resolution
on:
  workflow_dispatch:
  push:
    paths:
      - "research/phase30_13_low_vix_diagonal_resolution.py"
      - "tests/test_phase30_13_low_vix_diagonal_resolution.py"
      - ".github/workflows/phase-30.13-low-vix-diagonal-source-resolution.yml"
      - "research/phase30_13_launcher_trigger.txt"
permissions:
  contents: write
concurrency:
  group: phase30-13-low-vix-diagonal-source-resolution
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.head_ref || github.ref_name }}, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Install
        run: python -m pip install --disable-pip-version-check yt-dlp==2025.09.26 pytest==8.4.2
      - name: Tests
        run: PYTHONPATH=. pytest -q tests/test_phase30_13_low_vix_diagonal_resolution.py
      - name: Acquire and resolve evidence
        run: PYTHONPATH=. python research/phase30_13_low_vix_diagonal_resolution.py --out reports/phase30_13_source_resolution
      - name: Persist evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase30_13_source_resolution || true
          if ! git diff --cached --quiet; then
            git commit -m "Phase 30.13: persist low VIX diagonal source evidence"
            git push origin HEAD:"${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase30-13-low-vix-diagonal-source-resolution
          path: reports/phase30_13_source_resolution/
