name: Phase 27.7 - Air Defense source resolution

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/phase27-7-run.txt"
      - "research/phase27_7_air_defense_resolution.py"
      - "tests/test_phase27_7_air_defense_resolution.py"

permissions:
  contents: write

concurrency:
  group: phase27-7-air-defense-source-resolution
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-27.7-equity-income-air-defense-source-resolution-v1
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install requests==2.34.2 pytest==8.4.2
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase27_7_air_defense_resolution.py
      - name: Extract contextual evidence
        run: PYTHONPATH=. python research/phase27_7_air_defense_resolution.py
      - name: Validate evidence shape
        run: |
          python - <<'PY'
          import json
          s=json.load(open("reports/phase27_7_air_defense_contexts.json"))
          assert s["video_id"]=="aRjY_O6U3nQ"
          assert s["backtest_allowed"] is False
          assert len(s["contexts"]) == 12
          print({k: len(v) for k,v in s["contexts"].items()})
          PY
      - name: Persist evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/phase27_7_air_defense_contexts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Phase 27.7: persist Air Defense contextual evidence"
          git push origin HEAD:phase-27.7-equity-income-air-defense-source-resolution-v1
