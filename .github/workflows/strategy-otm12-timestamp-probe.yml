name: Strategy — OTM12 Phase A Timestamp Probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/otm12-phase-a-timestamp-probe
    paths:
      - research/strategy_otm12_timestamp_probe.py
      - .github/workflows/strategy-otm12-timestamp-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_ROOT: data/cache/phase24_trademarkk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/otm12-phase-a-timestamp-probe
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas duckdb pyarrow huggingface_hub
      - name: Restore pinned-data cache
        uses: actions/cache@v4
        with:
          path: data/cache/phase24_trademarkk
          key: phase24-trademarkk-51ca58c-v2
      - name: Acquire pinned dataset on cache miss
        run: |
          set -euo pipefail
          mkdir -p "$DATA_ROOT"
          if [ ! -f "$DATA_ROOT/index/NIFTY.parquet" ]; then
            for attempt in 1 2 3 4; do
              python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m",repo_type="dataset",revision="51ca58c",local_dir="data/cache/phase24_trademarkk",allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"])' && break
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep $((attempt*15))
            done
          fi
          test -f "$DATA_ROOT/index/NIFTY.parquet"
          test -f "$DATA_ROOT/options/NIFTY/2021-07-08.parquet"
      - name: Run timestamp probe
        run: |
          python research/strategy_otm12_timestamp_probe.py
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-otm12-phase-a-timestamp-probe
          path: reports/otm12-phase-a-timestamp-probe
