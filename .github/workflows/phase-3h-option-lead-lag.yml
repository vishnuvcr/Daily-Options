name: Phase 3H - Option Lead-Lag

on:
  workflow_dispatch:
  push:
    branches:
      - phase-3h-option-lead-lag
    paths:
      - "research/phase3h_option_lead_lag.py"
      - "research/phase3h_fast_engine.py"
      - "docs/phase3h_hypothesis.md"
      - "tests/test_phase3h_option_lead_lag.py"
      - "research/cost_model.py"
      - "research/contracts.py"
      - ".github/workflows/phase-3h-option-lead-lag.yml"

# Manual workflow_dispatch is required for reruns; push trigger provides CI on the branch.
concurrency:
  group: phase3h-option-lead-lag
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          pip install pandas pyarrow huggingface_hub pytest duckdb

      - name: Unit tests
        run: pytest -q tests/test_phase3h_option_lead_lag.py

      - uses: actions/cache@v4
        with:
          path: data/cache/hf_nifty_options
          key: nifty-options-artist23-45e0a04-v1
          restore-keys: |
            phase3g-artist23-45e0a04-v1

      - name: Acquire or reuse pinned dataset
        run: |
          mkdir -p data/cache/hf_nifty_options
          if ! find data/cache/hf_nifty_options -type f -name '*.parquet' -print -quit | grep -q .; then
            python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="artist-23/nifty-options-data", repo_type="dataset", revision="45e0a04", local_dir="data/cache/hf_nifty_options", allow_patterns=["NIFTY/**/*.parquet", "NIFTY/**"])'
          fi
          test -d data/cache/hf_nifty_options/NIFTY

      - name: Base and stress lead-lag tournament
        run: |
          python -m research.phase3h_fast_engine             --data data/cache/hf_nifty_options/NIFTY             --out reports/phase3h-base             --slippage 0.20

          python -m research.phase3h_fast_engine             --data data/cache/hf_nifty_options/NIFTY             --out reports/phase3h-stress             --slippage 0.40

      - name: Upload Phase 3H reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3h-option-lead-lag
          path: reports/
