name: Phase 3E - VWAP RSI Momentum

concurrency:
  group: phase3e-vwap-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy openpyxl pytest pyyaml
      - run: pytest -q
      - uses: actions/cache@v4
        with:
          path: data/cache/nifty_1y_1min.xlsx
          key: nifty-1y-1min-jul2025-jun2026-v1
      - run: |
          mkdir -p data/cache reports
          test -s data/cache/nifty_1y_1min.xlsx || curl -L --fail --retry 3 -o data/cache/nifty_1y_1min.xlsx https://raw.githubusercontent.com/rajmaurya0904/bhav/main/sample_data/nifty_1y_1min.xlsx
      - name: Document dataset volume limitation
        run: |
          python - <<'PY'
          import json, pathlib, pandas as pd
          p='data/cache/nifty_1y_1min.xlsx'
          s=pd.read_excel(p,sheet_name='Spot_1min')
          o=pd.read_excel(p,sheet_name='ATM_Options_1min')
          sv=pd.to_numeric(s['Volume'],errors='coerce').fillna(0)
          diag={
            'spot_rows': int(len(s)),
            'option_rows': int(len(o)),
            'spot_volume_nonzero_fraction': float((sv>0).mean()),
            'spot_volume_all_zero': bool((sv==0).all()),
            'option_types': sorted(o['Type'].astype(str).str.upper().replace({'CALL':'CE','PUT':'PE','C':'CE','P':'PE'}).unique().tolist())
          }
          pathlib.Path('reports').mkdir(exist_ok=True)
          pathlib.Path('reports/dataset_volume_diagnostic.json').write_text(json.dumps(diag,indent=2))
          print(json.dumps(diag,indent=2))
          PY
      - name: Run corrected VWAP/RSI momentum tournament
        run: python -m research.vwap_rsi_momentum --data data/cache/nifty_1y_1min.xlsx --out reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-3e-vwap-rsi-results
          path: reports/