name: Phase 27.1 - launcher

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/phase27-1-launch-trigger.txt"

permissions:
  contents: write

concurrency:
  group: phase27-1-equity-income-launcher
  cancel-in-progress: true

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Phase 27.1 branch
        uses: actions/checkout@v4
        with:
          ref: phase-27.1-equity-income-context-reconstruction-v1
          fetch-depth: 0
      - name: Sync Phase 26 inventory
        run: |
          set -euo pipefail
          git fetch origin phase-26-equity-income-inventory-v1
          git restore --source=origin/phase-26-equity-income-inventory-v1 -- data/equity_income/video_inventory.csv
          test -s data/equity_income/video_inventory.csv
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install requests==2.34.2 pytest==8.4.2
      - name: Unit tests
        run: python -m pytest -q tests/test_phase27_1_reconstruct.py
      - name: Extract evidence
        run: python research/phase27_1_reconstruct.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          s=json.load(open("data/equity_income/phase27_1_summary.json"))
          assert s["candidate_videos"] == 71
          assert s["errors"] == 0
          print(json.dumps(s, indent=2))
          PY
      - name: Persist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/equity_income/phase27_1_rule_evidence.jsonl data/equity_income/phase27_1_summary.json
          git commit -m "Phase 27.1: persist context-aware source evidence"
          git push origin HEAD:phase-27.1-equity-income-context-reconstruction-v1
