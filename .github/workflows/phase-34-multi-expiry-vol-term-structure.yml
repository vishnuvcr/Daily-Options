name: Phase 34 Multi-Expiry Volatility Term Structure

on:
  push:
    paths:
      - ".github/phase34-main-launch.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase34-term-structure
  cancel-in-progress: false

jobs:
  phase34:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-34-multi-expiry-vol-term-structure-v1
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --disable-pip-version-check             pandas==2.3.2 numpy==2.1.3 duckdb==1.3.2 pyarrow==19.0.1             pytest==8.4.2 matplotlib==3.10.6 huggingface_hub==0.36.0

      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase34_multi_expiry_vol_term_structure.py

      - name: Restore pinned NIFTY/options cache
        uses: actions/cache@v4
        with:
          path: data/cache/phase31_trademarkk
          key: phase31-trademarkk-51ca58c-v1
          restore-keys: |
            phase31-trademarkk-51ca58c-

      - name: Acquire or reuse pinned NIFTY/options source
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase31_trademarkk
          if [ ! -f data/cache/phase31_trademarkk/index/NIFTY.parquet ]; then
            python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m",repo_type="dataset",revision="51ca58c",local_dir="data/cache/phase31_trademarkk",allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"])'
          fi

      - name: Data gate
        run: |
          PYTHONPATH=. python research/phase34_multi_expiry_vol_term_structure.py             --data data/cache/phase31_trademarkk             --out reports/phase34/gate             --gate-only

      - name: Enforce data gate
        run: |
          python -c 'import json,sys; g=json.load(open("reports/phase34/gate/data_gate.json")); print(json.dumps(g,indent=2)); sys.exit(0 if g["status"]=="PASS" else 1)'

      - name: Base discovery
        run: |
          PYTHONPATH=. python research/phase34_multi_expiry_vol_term_structure.py             --data data/cache/phase31_trademarkk             --out reports/phase34/base             --slippage 0.20

      - name: Stress discovery
        run: |
          PYTHONPATH=. python research/phase34_multi_expiry_vol_term_structure.py             --data data/cache/phase31_trademarkk             --out reports/phase34/stress             --slippage 0.40

      - name: Validate artifacts
        run: |
          python - <<'PY'
          import pandas as pd, json
          g=json.load(open("reports/phase34/gate/data_gate.json"))
          assert g["status"]=="PASS"
          for fr in ("base","stress"):
              s=pd.read_csv(f"reports/phase34/{fr}/true_cell_summary.csv")
              assert len(s)==8
              n=pd.read_csv(f"reports/phase34/{fr}/null_summary.csv")
              assert len(n)==40
              c=pd.read_csv(f"reports/phase34/{fr}/price_coverage.csv")
              d=pd.read_csv(f"reports/phase34/{fr}/debit_admissibility.csv")
              assert len(c)==8 and len(d)==8
              assert c.coverage_rate.min()>=0.95
          PY

      - name: Persist artifacts
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/phase34_* reports/phase34 research/phase34_multi_expiry_vol_term_structure.py tests/test_phase34_multi_expiry_vol_term_structure.py || true
          if ! git diff --cached --quiet; then
            git commit -m "Phase 34: persist term-structure research artifacts"
            for attempt in 1 2 3; do
              if git push origin HEAD:phase-34-multi-expiry-vol-term-structure-v1; then exit 0; fi
              git fetch origin phase-34-multi-expiry-vol-term-structure-v1
              git rebase FETCH_HEAD
            done
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase34-term-structure
          path: reports/phase34
