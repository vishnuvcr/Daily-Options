name: Phase 27 - Source-faithful strategy reconstruction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-27-equity-income-reconstruction-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Phase definition
        run: |
          echo "Phase 27: Source-faithful strategy reconstruction"
          echo "Manual execution branch: phase-27-equity-income-reconstruction-v1"
          echo "Weekly target: INR 5,000 net per traded week at fixed reference sizing"
          echo "Scope: Recover exact rules for every candidate. Tag every rule field SOURCE-EXPLICIT, SOURCE-INFERRED, UNSPECIFIED or CONFLICTING."
