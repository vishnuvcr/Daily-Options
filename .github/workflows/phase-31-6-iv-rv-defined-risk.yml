name: Phase 31.6 - IV-RV defined-risk discovery
on:
  workflow_dispatch:
  push:
    paths:
      - "docs/phase31_6_plan.md"
      - "research/phase31_6_iv_rv_defined_risk.py"
      - "tests/test_phase31_6_iv_rv_defined_risk.py"
      - ".github/workflows/phase-31-6-iv-rv-defined-risk.yml"
permissions:
  contents: write
concurrency:
  group: phase31-6-iv-rv-defined-risk
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.3.2 numpy==2.1.3 duckdb==1.3.2 pyarrow==19.0.1 pytest==8.4.2 huggingface_hub==0.35.3
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase31_6_iv_rv_defined_risk.py
      - name: Cache pinned NIFTY source
        uses: actions/cache@v4
        with:
          path: data/cache/phase31_trademarkk
          key: phase31-trademarkk-51ca58c-v1
          restore-keys: |
            phase31-trademarkk-51ca58c-
            phase30-trademarkk-51ca58c-
      - name: Acquire or reuse exact-expiry NIFTY data
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase31_trademarkk
          if [ ! -f data/cache/phase31_trademarkk/index/NIFTY.parquet ]; then
            python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m",repo_type="dataset",revision="51ca58c",local_dir="data/cache/phase31_trademarkk",allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"])'
          fi
      - name: Run Base discovery
        run: PYTHONPATH=. python research/phase31_6_iv_rv_defined_risk.py --data data/cache/phase31_trademarkk --out reports/phase31_6/base --slippage 0.20
      - name: Run Stress discovery
        run: PYTHONPATH=. python research/phase31_6_iv_rv_defined_risk.py --data data/cache/phase31_trademarkk --out reports/phase31_6/stress --slippage 0.40
      - name: Validate outputs
        run: |
          python - <<'PY'
          import pandas as pd
          for k in ["base","stress"]:
              x=pd.read_csv(f"reports/phase31_6/{k}/cell_summary.csv")
              assert len(x) == 12, (k,len(x))
              assert set(x.friction)=={k}
              t=pd.read_csv(f"reports/phase31_6/{k}/trades.csv")
              assert len(t)>0
          PY
      - name: Persist outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/phase31_6
          if ! git diff --cached --quiet; then
            git commit -m "Phase 31.6: persist IV-RV discovery outputs"
            git push origin HEAD:"${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase31-6-iv-rv-discovery
          path: reports/phase31_6/
