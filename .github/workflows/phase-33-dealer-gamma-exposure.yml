name: Phase 33 Dealer Gamma Exposure

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force rebuild of the cached gamma/OI feature panel"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  phase33:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check pandas==2.3.2 numpy==2.1.3 duckdb==1.3.2 pyarrow==19.0.1 pytest==8.4.2 matplotlib==3.10.6 requests==2.32.5 huggingface_hub==0.36.0

      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase33_dealer_gamma_exposure.py

      - name: Restore pinned NIFTY/options cache
        uses: actions/cache@v4
        with:
          path: data/cache/phase31_trademarkk
          key: phase31-trademarkk-51ca58c-v1
          restore-keys: |
            phase31-trademarkk-51ca58c-

      - name: Acquire or reuse pinned NIFTY/options source
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase31_trademarkk
          if [ ! -f data/cache/phase31_trademarkk/index/NIFTY.parquet ]; then
            python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m",repo_type="dataset",revision="51ca58c",local_dir="data/cache/phase31_trademarkk",allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"])'
          fi

      - name: Run data gate
        run: |
          PYTHONPATH=. python research/phase33_dealer_gamma_exposure.py --data data/cache/phase31_trademarkk --out reports/phase33/gate --gate-only

      - name: Enforce data gate
        run: |
          python -c 'import json,sys; g=json.load(open("reports/phase33/gate/data_gate.json")); print(json.dumps(g,indent=2)); sys.exit(0 if g["status"]=="PASS" else 1)'

      - name: Run Base
        run: |
          PYTHONPATH=. python research/phase33_dealer_gamma_exposure.py --data data/cache/phase31_trademarkk --out reports/phase33/base --slippage 0.20

      - name: Run Stress
        run: |
          PYTHONPATH=. python research/phase33_dealer_gamma_exposure.py --data data/cache/phase31_trademarkk --out reports/phase33/stress --slippage 0.40

      - name: Validate Phase 33 artifacts
        run: |
          python - <<'PY'
          import pandas as pd, pathlib, json
          g=json.load(open("reports/phase33/gate/data_gate.json"))
          assert g["status"]=="PASS"
          for fr in ("base","stress"):
              s=pd.read_csv(f"reports/phase33/{fr}/true_cell_summary.csv")
              assert len(s)==12
              n=pd.read_csv(f"reports/phase33/{fr}/null_summary.csv")
              assert len(n)==60
              c=pd.read_csv(f"reports/phase33/{fr}/price_coverage.csv")
              assert len(c)==12 and c.coverage_rate.min()>=0.95
          PY

      - name: Persist artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/phase33_* reports/phase33 docs/phase33_* research/phase33_dealer_gamma_exposure.py tests/test_phase33_dealer_gamma_exposure.py || true
          git diff --cached --quiet || git commit -m "Phase 33: persist workflow artifacts"
          git push
