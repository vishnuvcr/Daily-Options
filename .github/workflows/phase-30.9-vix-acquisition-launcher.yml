name: Phase 30.9 - VIX acquisition launcher

on:
  workflow_dispatch:
  push:
    paths:
      - "research/phase30_9_launcher_trigger.txt"

permissions:
  contents: write

concurrency:
  group: phase30-9-vix-acquisition
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-30.9-strangle-air-defense-vix-source-resolution-v1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check pandas requests
      - name: Fetch and validate NSE VIX
        run: |
          set -euo pipefail
          python research/phase30_9_fetch_nse_vix.py \
            --start 2025-09-01 \
            --end 2026-08-31 \
            --output data/cache/phase30_9_india_vix/nse_india_vix_2025-09-01_2026-08-31.csv \
            --metadata reports/phase30_9_vix_coverage.json
      - name: Persist VIX cache to phase branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/cache/phase30_9_india_vix/nse_india_vix_2025-09-01_2026-08-31.csv reports/phase30_9_vix_coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Phase 30.9: persist NSE India VIX study-window cache"
            git fetch origin phase-30.9-strangle-air-defense-vix-source-resolution-v1
            git rebase origin/phase-30.9-strangle-air-defense-vix-source-resolution-v1
            git push origin HEAD:phase-30.9-strangle-air-defense-vix-source-resolution-v1
          fi
      - name: Upload VIX cache
        uses: actions/upload-artifact@v4
        with:
          name: phase30-9-nse-vix-cache
          path: |
            data/cache/phase30_9_india_vix/nse_india_vix_2025-09-01_2026-08-31.csv
            reports/phase30_9_vix_coverage.json
