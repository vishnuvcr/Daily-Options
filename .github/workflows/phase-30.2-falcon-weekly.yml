name: Phase 30.2 - Falcon gate diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/phase30-2-run.txt'
      - 'research/phase30_2_falcon_gate_diagnostic.py'
      - '.github/workflows/phase-30.2-falcon-weekly.yml'

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas duckdb pyarrow huggingface_hub
      - name: Restore exact Phase 30.2 cache
        uses: actions/cache@v4
        with:
          path: data/cache/phase30_2_rissin
          key: phase30-2-rissin-nifty-runtime-resolved-v1
      - name: Acquire exact source revision if cache misses
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase30_2_rissin
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          repo_id='rissin/nse-options-intraday'
          sha='8f7739cab3f38abdcbc6332a6d0a83e1341326e3'
          out=Path('data/cache/phase30_2_rissin')
          for year in ('2025','2026'):
              target=out/f'NIFTY_{year}.parquet'
              if not target.exists():
                  p=hf_hub_download(repo_id=repo_id,filename=f'upstox_intraday/NIFTY/NIFTY_{year}.parquet',repo_type='dataset',revision=sha,local_dir=str(out),local_dir_use_symlinks=False)
                  Path(p).replace(target) if Path(p)!=target else None
          PY
      - name: Run gate diagnostic
        run: PYTHONPATH=. python research/phase30_2_falcon_gate_diagnostic.py
      - name: Persist diagnostic
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/phase30_2_falcon_gate_diagnostic.json
          git commit -m 'Phase 30.2: persist Falcon gate diagnostic'
          git push origin HEAD:"${GITHUB_REF_NAME}"
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: phase30-2-falcon-gate-diagnostic
          path: reports/phase30_2_falcon_gate_diagnostic.json
