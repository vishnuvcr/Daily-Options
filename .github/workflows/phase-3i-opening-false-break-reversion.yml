name: Phase 3I - Opening False Break Reversion

on:
  workflow_dispatch:
  push:
    branches:
      - phase-3i-opening-false-break-reversion
    paths:
      - "research/phase3i_opening_false_break_reversion.py"
      - "docs/phase3i_hypothesis.md"
      - "tests/test_phase3i_opening_false_break_reversion.py"
      - "research/cost_model.py"
      - "research/contracts.py"
      - ".github/workflows/phase-3i-opening-false-break-reversion.yml"

concurrency:
  group: phase3i-opening-false-break-reversion
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          pip install pandas pyarrow huggingface_hub pytest duckdb

      - name: Unit tests
        run: pytest -q tests/test_phase3i_opening_false_break_reversion.py

      - uses: actions/cache@v4
        with:
          path: data/cache/hf_nifty_options
          key: nifty-options-artist23-45e0a04-v1
          restore-keys: |
            phase3g-artist23-45e0a04-v1

      - name: Acquire or reuse pinned dataset
        run: |
          mkdir -p data/cache/hf_nifty_options
          if ! find data/cache/hf_nifty_options -type f -name '*.parquet' -print -quit | grep -q .; then
            python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="artist-23/nifty-options-data", repo_type="dataset", revision="45e0a04", local_dir="data/cache/hf_nifty_options", allow_patterns=["NIFTY/**/*.parquet", "NIFTY/**"])'
          fi
          test -d data/cache/hf_nifty_options/NIFTY

      - name: Run Phase 3I base and stress in one data pass
        run: |
          python -m research.phase3i_opening_false_break_reversion             --data data/cache/hf_nifty_options/NIFTY             --out reports/phase3i

      - name: Upload Phase 3I reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3i-opening-false-break
          path: reports/
