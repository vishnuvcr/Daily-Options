name: Phase 15 - VRP Jump Brake Short Volatility

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - phase-15-vrp-jump-brake-short-vol-v1

concurrency:
  group: phase15-vrp-jump-brake-v1
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas pyarrow duckdb huggingface_hub pytest numpy
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase15_vrp_jump_brake_short_vol.py
      - name: Reuse pinned Phase 3F Artist23 cache
        uses: actions/cache@v4
        with:
          path: data/cache/hf_nifty_options
          key: phase3f-artist23-45e0a04-v2
      - name: Acquire or reuse pinned Artist23 dataset
        run: |
          set -euo pipefail
          mkdir -p data/cache/hf_nifty_options
          if ! find data/cache/hf_nifty_options -type f -name '*.parquet' -print -quit | grep -q .; then
            python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='artist-23/nifty-options-data', repo_type='dataset', revision='45e0a04', local_dir='data/cache/hf_nifty_options', allow_patterns=['NIFTY/**/*.parquet'])"
          fi
          test -d data/cache/hf_nifty_options/NIFTY
      - name: Lightweight timestamp and quote alignment probe
        run: |
          python - <<'PY'
          from pathlib import Path
          import duckdb, json
          root=Path('data/cache/hf_nifty_options/NIFTY')
          g=(root/'**'/'*.parquet').as_posix()
          con=duckdb.connect()
          q=f"""
          SELECT
            CAST(date AS DATE) AS date_field,
            STRFTIME(CAST(datetime AS TIMESTAMP) + INTERVAL '5 hours 30 minutes','%H:%M:%S') AS ist_time,
            expiry_type,
            strike_type,
            option_type,
            COUNT(*) AS rows
          FROM read_parquet('{g}', union_by_name=true)
          WHERE close>0
            AND STRFTIME(CAST(datetime AS TIMESTAMP) + INTERVAL '5 hours 30 minutes','%H:%M:%S') IN ('09:30:00','09:31:00','10:00:00','10:01:00','10:30:00','10:31:00')
          GROUP BY ALL
          ORDER BY date_field,ist_time,expiry_type,strike_type,option_type
          LIMIT 200
          """
          x=con.execute(q).df()
          Path('reports').mkdir(parents=True,exist_ok=True)
          x.to_json('reports/phase15_alignment_probe.json',orient='records',date_format='iso')
          print(x.to_string(index=False))
          print("row_count_probe",len(x))
          con.close()
          PY

      - name: Upload alignment probe
        uses: actions/upload-artifact@v4
        with:
          name: phase15-alignment-probe
          path: reports/phase15_alignment_probe.json
          if-no-files-found: error

      - name: Base friction
        run: PYTHONPATH=. python -m research.phase15_vrp_jump_brake_short_vol --data data/cache/hf_nifty_options/NIFTY --out reports/phase15-base --slippage 0.20
      - name: Stress friction
        run: PYTHONPATH=. python -m research.phase15_vrp_jump_brake_short_vol --data data/cache/hf_nifty_options/NIFTY --out reports/phase15-stress --slippage 0.40
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase15-vrp-jump-brake-short-vol-v1
          path: reports/
