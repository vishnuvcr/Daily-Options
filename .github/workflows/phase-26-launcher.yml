name: Phase 26 - launcher

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/phase26-launch-trigger.txt"
  pull_request:
    paths:
      - ".github/phase26-launch-trigger.txt"

permissions:
  contents: write

concurrency:
  group: phase26-equity-income-inventory-launcher
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Phase 26 research branch
        uses: actions/checkout@v4
        with:
          ref: phase-26-equity-income-inventory-v1
          fetch-depth: 0

      - name: Sync frozen archive input
        run: |
          set -euo pipefail
          git fetch origin equity-income-channel-archive-v1
          git restore --source=origin/equity-income-channel-archive-v1 -- data/equity_income

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: python -m pip install pytest==8.4.2

      - name: Run Phase 26 unit tests
        run: python -m pytest -q tests/test_phase26_inventory.py

      - name: Build inventory
        run: python scripts/build_equity_income_inventory.py --root data/equity_income

      - name: Validate completed archive and Phase 26 outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          root="data/equity_income"
          snap=json.load(open(f"{root}/channel_snapshot.json"))
          assert snap["discovered_videos"] == 169
          assert snap["transcript_archived"] == 169
          assert snap["integrity_ok"] == 169
          assert snap["transcript_errors"] == 0
          inv=list(csv.DictReader(open(f"{root}/video_inventory.csv", newline="", encoding="utf-8")))
          reg=list(csv.DictReader(open(f"{root}/strategy_registry.csv", newline="", encoding="utf-8")))
          assert len(inv) == 169
          assert len(reg) == 169
          assert all(r["transcript_integrity"] == "VERIFIED" for r in inv)
          print("Phase 26 launcher gate: PASS")
          print(json.dumps(json.load(open(f"{root}/inventory_snapshot.json")), indent=2))
          PY

      - name: Persist Phase 26 outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/equity_income/video_inventory.csv                   data/equity_income/strategy_registry.csv                   data/equity_income/inventory_snapshot.json
          if git diff --cached --quiet; then
            echo "No Phase 26 changes."
            exit 0
          fi
          git commit -m "Phase 26: persist complete Equity Income inventory"
          git push origin HEAD:phase-26-equity-income-inventory-v1
