name: Phase 28 - Equity Income family clustering

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/phase28-trigger.txt"

permissions:
  contents: write

concurrency:
  group: phase28-equity-income-dedup
  cancel-in-progress: true

jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Phase 28 branch
        uses: actions/checkout@v4
        with:
          ref: phase-28-equity-income-dedup-v1
          fetch-depth: 0

      - name: Sync Phase 27 inputs
        run: |
          set -euo pipefail
          git fetch origin phase-27-equity-income-reconstruction-v1
          git restore --source=origin/phase-27-equity-income-reconstruction-v1 -- data/equity_income
          test -s data/equity_income/video_inventory.csv
          test -s data/equity_income/phase27_rule_evidence.jsonl

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: python -m pip install pytest==8.4.2

      - name: Unit tests
        run: python -m pytest -q tests/test_phase28_cluster.py

      - name: Build family clusters
        run: python research/phase28_cluster.py

      - name: Validate no backtest promotion
        run: |
          python - <<'PY'
          import csv, json
          s=json.load(open("data/equity_income/phase28_summary.json"))
          assert s["backtest_allowed_members"] == 0
          rows=list(csv.DictReader(open("data/equity_income/strategy_families.csv", newline="", encoding="utf-8")))
          assert len(rows) >= 60
          assert all(r["backtest_allowed"] == "NO" for r in rows)
          print(json.dumps(s, indent=2))
          PY

      - name: Persist Phase 28 outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/equity_income/strategy_families.csv data/equity_income/phase28_summary.json
          if git diff --cached --quiet; then
            echo "No Phase 28 output changes."
            exit 0
          fi
          git commit -m "Phase 28: build strategy family clusters"
          git push origin HEAD:phase-28-equity-income-dedup-v1
