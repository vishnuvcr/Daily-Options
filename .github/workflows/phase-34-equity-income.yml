name: Phase 34 - Portfolio research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-34-equity-income-portfolio-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Phase definition
        run: |
          echo "Phase 34: Portfolio research"
          echo "Manual execution branch: phase-34-equity-income-portfolio-v1"
          echo "Weekly target: INR 5,000 net per traded week at fixed reference sizing"
          echo "Scope: Combine only individually validated strategies and study weekly P&L correlation, margin overlap and joint drawdown."
