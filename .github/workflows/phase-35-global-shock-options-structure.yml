name: Phase 35 Global Shock Options Structure
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/phase-35-global-shock-options-structure.yml"
      - ".github/phase35-main-launch.txt"
permissions:
  contents: write
concurrency:
  group: phase35-global-shock
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Install pinned runtime
        run: pip install pandas==2.3.2 numpy==2.1.3 duckdb==1.3.2 pyarrow==19.0.1 pytest==8.4.2 yfinance==0.2.66
      - name: Restore pinned NIFTY/options cache
        uses: actions/cache@v4
        with:
          path: data/cache/phase31_trademarkk
          key: phase31-trademarkk-51ca58c-v1
      - name: Restore global cache
        uses: actions/cache@v4
        with:
          path: data/cache/phase31_8_global
          key: phase31-8-global-yahoo-v1
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase35_global_shock_options_structure.py
      - name: Data gate
        run: PYTHONPATH=. python research/phase35_global_shock_options_structure.py --data data/cache/phase31_trademarkk --global-data data/cache/phase31_8_global --out reports/phase35/gate --gate-only
      - name: Enforce gate
        run: python - <<'PY'
import json,sys
g=json.load(open("reports/phase35/gate/data_gate.json"))
sys.exit(0 if g["status"]=="PASS" else 1)
PY
      - name: Base discovery
        run: PYTHONPATH=. python research/phase35_global_shock_options_structure.py --data data/cache/phase31_trademarkk --global-data data/cache/phase31_8_global --out reports/phase35/base --slippage 0.20
      - name: Stress discovery
        run: PYTHONPATH=. python research/phase35_global_shock_options_structure.py --data data/cache/phase31_trademarkk --global-data data/cache/phase31_8_global --out reports/phase35/stress --slippage 0.40
      - name: Persist artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase35 docs/phase35_* || true
          if ! git diff --cached --quiet; then git commit -m "Phase 35: persist global shock research artifacts"; git push origin HEAD:phase-35-global-shock-options-structure-v1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: phase35-global-shock-options-structure
          path: reports/phase35
