name: Phase 27.3 - Equity Income T1 rule sheets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/phase27-3-trigger.txt"

permissions:
  contents: write

concurrency:
  group: phase27-3-equity-income-rule-sheets
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Phase 27.3 branch
        uses: actions/checkout@v4
        with:
          ref: phase-27.3-equity-income-t1-rule-sheets-v1
          fetch-depth: 0
      - name: Sync Phase 27.1 and 27.2 inputs
        run: |
          set -euo pipefail
          git fetch origin phase-27.1-equity-income-context-reconstruction-v1
          git fetch origin phase-27.2-equity-income-reconstruction-priority-v1
          git restore --source=origin/phase-27.1-equity-income-context-reconstruction-v1 -- data/equity_income/phase27_1_rule_evidence.jsonl
          git restore --source=origin/phase-27.2-equity-income-reconstruction-priority-v1 -- reports/phase27_2_reconstruction_priority.csv data/equity_income/phase27_2_external_evidence.json
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m pytest -q tests/test_phase27_3_rule_sheets.py
      - name: Build T1 rule sheets
        run: python research/phase27_3_rule_sheets.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          s=json.load(open("reports/phase27_3_t1_manifest.json"))
          assert len(s)==8
          assert all(r["backtest_allowed"]=="NO" for r in s)
          print('T1 rule-sheet gate: PASS')
          PY
      - name: Persist rule sheets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/equity_income_strategy_rules/t1 reports/phase27_3_t1_manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Phase 27.3: persist T1 source rule sheets"
          git push origin HEAD:phase-27.3-equity-income-t1-rule-sheets-v1
