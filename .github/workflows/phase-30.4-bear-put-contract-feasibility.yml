name: Phase 30.4 - Bear Put contract/data feasibility

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-30.4-equity-income-bear-put-contract-feasibility-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - run: PYTHONPATH=. pytest -q tests/test_phase30_4_bear_put_contract_feasibility.py
      - run: PYTHONPATH=. python research/phase30_4_bear_put_contract_feasibility.py
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase30_4_bear_put_contract_feasibility.json
          if ! git diff --cached --quiet; then
            git commit -m "Phase 30.4: persist Bear Put contract feasibility"
            git push origin HEAD:phase-30.4-equity-income-bear-put-contract-feasibility-v1
          fi
