name: Phase 29 - Historical data feasibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-29-equity-income-data-feasibility-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Phase definition
        run: |
          echo "Phase 29: Historical data feasibility"
          echo "Manual execution branch: phase-29-equity-income-data-feasibility-v1"
          echo "Weekly target: INR 5,000 net per traded week at fixed reference sizing"
          echo "Scope: Check data coverage, expiry identity, quote completeness, lot sizes, transaction costs and required regime variables."
