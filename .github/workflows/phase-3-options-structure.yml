name: Phase 3 - Options Structure
concurrency:
  group: phase3-structure-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  spread:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: pip install pandas openpyxl numpy pytest pyyaml
      - name: Unit tests
        run: pytest -q
      - name: Download public one-year NIFTY sample
        run: |
          mkdir -p data/cache reports
          curl -L --fail --retry 3 -o data/cache/nifty_1y_1min.xlsx https://raw.githubusercontent.com/rajmaurya0904/bhav/main/sample_data/nifty_1y_1min.xlsx
      - name: Run vertical spread tournament
        run: python -m research.spread_tournament --data data/cache/nifty_1y_1min.xlsx --out reports
      - name: Run VRP regime filter tournament
        run: python -m research.vrp_filter_tournament --data data/cache/nifty_1y_1min.xlsx --out reports
      - name: Run short volatility tournament
        run: python -m research.short_straddle_tournament --data data/cache/nifty_1y_1min.xlsx --out reports
      - name: Run VRP-filtered short volatility tournament
        run: python -m research.short_straddle_vrp_tournament --data data/cache/nifty_1y_1min.xlsx --out reports
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-preliminary-spread-results
          path: reports/
