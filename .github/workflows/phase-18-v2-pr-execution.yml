name: Phase 18 v2 - PR Execution

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: phase18-v2-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        friction: [base, stress]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow duckdb huggingface_hub pytest
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase18_nifty_iron_condor_regime.py
      - name: Cache exact-expiry data
        uses: actions/cache@v4
        with:
          path: data/cache/phase18_trademarkk
          key: phase18-trademarkk-51ca58c-v2
          restore-keys: |
            phase17-trademarkk-51ca58c-v1
            phase17-trademarkk-51ca58c-
      - name: Acquire or reuse data
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase18_trademarkk
          if [ ! -f data/cache/phase18_trademarkk/index/NIFTY.parquet ]; then
            for attempt in 1 2 3 4; do
              python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m",repo_type="dataset",revision="51ca58c",local_dir="data/cache/phase18_trademarkk",allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"])' && break
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep $((attempt*15))
            done
          fi
      - name: Run friction
        env:
          SLIP: ${{ matrix.friction == 'base' && '0.20' || '0.40' }}
          LABEL: ${{ matrix.friction }}
        run: |
          PYTHONPATH=. python -m research.phase18_nifty_iron_condor_regime \
            --data data/cache/phase18_trademarkk \
            --out reports/$LABEL \
            --slippage "$SLIP"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-v2-pr-${{ matrix.friction }}
          path: reports/
