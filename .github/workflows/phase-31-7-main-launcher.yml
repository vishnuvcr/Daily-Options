name: Phase 31.7 main launcher

on:
  push:
    paths:
      - ".github/phase31_7-main-launch.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-31.7-oi-volume-microstructure-v1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.3.2 numpy==2.1.3 duckdb==1.3.2 pyarrow==19.0.1 pytest==8.4.2 huggingface_hub==0.35.3
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase31_7_oi_volume_microstructure.py
      - name: Cache pinned NIFTY source
        uses: actions/cache@v4
        with:
          path: data/cache/phase31_trademarkk
          key: phase31-trademarkk-51ca58c-v1
          restore-keys: |
            phase31-trademarkk-51ca58c-
            phase30-trademarkk-51ca58c-
      - name: Acquire or reuse exact-expiry NIFTY data
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase31_trademarkk
          if [ ! -f data/cache/phase31_trademarkk/index/NIFTY.parquet ]; then
            python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m",repo_type="dataset",revision="51ca58c",local_dir="data/cache/phase31_trademarkk",allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"])'
          fi
      - name: Run data gate
        run: PYTHONPATH=. python research/phase31_7_oi_volume_microstructure.py --data data/cache/phase31_trademarkk --out reports/phase31_7/gate --gate-only
      - name: Run Base discovery
        run: |
          if python -c 'import json,sys; g=json.load(open("reports/phase31_7/gate/data_gate.json")); sys.exit(0 if g["status"]=="PASS" else 1)'; then
            PYTHONPATH=. python research/phase31_7_oi_volume_microstructure.py --data data/cache/phase31_trademarkk --out reports/phase31_7/base --slippage 0.20
          else
            echo "DATA_GATE_FAIL: numerical stage intentionally skipped"
          fi

      - name: Run Stress discovery
        run: |
          if python -c 'import json,sys; g=json.load(open("reports/phase31_7/gate/data_gate.json")); sys.exit(0 if g["status"]=="PASS" else 1)'; then
            PYTHONPATH=. python research/phase31_7_oi_volume_microstructure.py --data data/cache/phase31_trademarkk --out reports/phase31_7/stress --slippage 0.40
          else
            echo "DATA_GATE_FAIL: numerical stage intentionally skipped"
          fi

      - name: Validate
        run: |
          python - <<'PY'
          import json,pandas as pd
          g=json.load(open("reports/phase31_7/gate/data_gate.json"))
          if g["status"]=="PASS":
              for k in ["base","stress"]:
                  x=pd.read_csv(f"reports/phase31_7/{k}/true_cell_summary_{k}.csv")
                  assert len(x)==12,(k,len(x))
                  assert set(x.friction)=={k}
                  t=pd.read_csv(f"reports/phase31_7/{k}/trades_{k}.csv")
                  assert len(t)>0,(k,"zero trades")
                  sig=pd.read_csv(f"reports/phase31_7/{k}/signal_counts.csv")
                  assert len(sig)>0,(k,"zero signals")
                  cov=pd.read_csv(f"reports/phase31_7/{k}/price_coverage.csv")
                  assert int(cov.complete_price_coverage.sum())==len(t),(k,"price coverage mismatch")
                  n=pd.read_csv(f"reports/phase31_7/{k}/null_summary_{k}.csv")
                  assert len(n)==60,(k,len(n))
                  nt=pd.read_csv(f"reports/phase31_7/{k}/null_trades_{k}.csv")
                  assert len(nt)>0,(k,"zero null trades")
          PY
      - name: Persist outputs to phase branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/phase31_7
          if ! git diff --cached --quiet; then
            git commit -m "Phase 31.7: persist OI-volume discovery outputs"
            git push origin HEAD:phase-31.7-oi-volume-microstructure-v1
          fi
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase31-7-oi-volume-microstructure
          path: reports/phase31_7/
