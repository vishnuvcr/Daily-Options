name: Strategy — OTM12 Phase D Frozen Holdout Filter Probe

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Clean validated workflow run containing Base and Stress artifacts
        required: true
        default: "36532252218"
  push:
    branches:
      - research/otm12-phase-d-holdout-filter
    paths:
      - research/strategy_otm12_phase_d_holdout_filter.py
      - .github/workflows/strategy-otm12-phase-d-holdout-filter.yml

permissions:
  contents: read
  actions: read

jobs:
  phase_d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/otm12-phase-d-holdout-filter
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy pyarrow
      - name: Download clean Base artifact
        uses: actions/download-artifact@v4
        with:
          name: strategy-otm12-base
          repository: vishnuvcr/Daily-Options
          run-id: ${{ inputs.source_run_id || '36532252218' }}
          github-token: ${{ github.token }}
          path: base_artifact
      - name: Download clean Stress artifact
        uses: actions/download-artifact@v4
        with:
          name: strategy-otm12-stress
          repository: vishnuvcr/Daily-Options
          run-id: ${{ inputs.source_run_id || '36532252218' }}
          github-token: ${{ github.token }}
          path: stress_artifact
      - name: Run Phase D
        run: python research/strategy_otm12_phase_d_holdout_filter.py
      - name: Upload Phase D results
        uses: actions/upload-artifact@v4
        with:
          name: strategy-otm12-phase-d-results
          path: reports/phase-d
