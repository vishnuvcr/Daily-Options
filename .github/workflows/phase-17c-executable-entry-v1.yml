name: Phase 17c - Executable Entry Exact-Expiry Tournament

on:
  workflow_dispatch:
  push:
    branches: [phase-17c-executable-entry-v1]

concurrency:
  group: phase17c-executable-entry
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        friction: [base, stress]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "phase-17c-executable-entry-v1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy pyarrow duckdb huggingface_hub pytest
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase17_nifty_exact_expiry_premium_skew.py
      - name: Cache TradeMarkk data
        uses: actions/cache@v4
        with:
          path: data/cache/phase17_trademarkk
          key: phase17-trademarkk-51ca58c-v1
      - name: Acquire or reuse data
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase17_trademarkk
          if [ ! -f data/cache/phase17_trademarkk/index/NIFTY.parquet ]; then
            python - <<'PY'
from huggingface_hub import snapshot_download
snapshot_download(repo_id="thetrademarkk/india-index-options-1m",repo_type="dataset",revision="51ca58c",local_dir="data/cache/phase17_trademarkk",allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"])
PY
          fi
      - name: Run friction
        env:
          SLIP: ${{ matrix.friction == 'base' && '0.20' || '0.40' }}
          LABEL: ${{ matrix.friction }}
        run: |
          PYTHONPATH=. python -m research.phase17_nifty_exact_expiry_premium_skew \
            --data data/cache/phase17_trademarkk \
            --out reports/$LABEL \
            --slippage "$SLIP"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase17c-${{ matrix.friction }}
          path: reports/
