name: Phase 35 Global Shock x India Volatility
on:
  workflow_dispatch:
  push:
    branches: [phase-35-global-shock-india-volatility-v1]
permissions:
  contents: write
concurrency:
  group: phase35-global-shock-india-volatility-v1
  cancel-in-progress: true
jobs:
  phase35:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.3.2 numpy==2.1.3 duckdb==1.3.2 pyarrow==19.0.1 yfinance==1.7.0 pytest==8.4.2 huggingface_hub==0.34.4
      - name: Clean Phase 35 report workspace
        run: rm -rf reports/phase35 && mkdir -p reports/phase35
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests/test_phase35_global_shock_india_volatility.py
      - name: Acquire or reuse exact-expiry NIFTY data
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase31_trademarkk
          if [ ! -f data/cache/phase31_trademarkk/index/NIFTY.parquet ]; then
            python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m",repo_type="dataset",revision="51ca58c",local_dir="data/cache/phase31_trademarkk",allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"])'
          fi
      - name: Acquire or reuse global indices
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/phase31_8_acquire_global.py --out data/cache/phase31_8_global
      - name: Data gate
        run: PYTHONPATH=. python research/phase35_global_shock_india_volatility.py --data data/cache/phase31_trademarkk --global-data data/cache/phase31_8_global --out reports/phase35/gate --gate-only
      - name: Base
        run: PYTHONPATH=. python research/phase35_global_shock_india_volatility.py --data data/cache/phase31_trademarkk --global-data data/cache/phase31_8_global --out reports/phase35/base --slippage 0.20
      - name: Stress
        run: PYTHONPATH=. python research/phase35_global_shock_india_volatility.py --data data/cache/phase31_trademarkk --global-data data/cache/phase31_8_global --out reports/phase35/stress --slippage 0.40
      - name: Accounting reconciliation
        run: |
          python - <<'PY'
          import pandas as pd, pathlib
          for p in pathlib.Path('reports/phase35').glob('*/trades_*.csv'):
              if p.stat().st_size <= 1:
                  continue
              try:
                  d=pd.read_csv(p)
              except pd.errors.EmptyDataError:
                  continue
              if not d.empty:
                  e=(d.raw_gross-d.slippage_cost-d.transaction_costs-d.net_pnl).abs().max()
                  assert e < 1e-8, (str(p),e)
          PY
      - name: Persist artifacts
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/phase35
          git commit -m 'Phase 35: persist Base Stress and null artifacts' || true
          git pull --rebase origin phase-35-global-shock-india-volatility-v1
          git push origin HEAD:phase-35-global-shock-india-volatility-v1
      - name: Upload Phase 35 audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase35-audit
          path: reports/phase35/

# Phase 35 authoritative execution trigger
