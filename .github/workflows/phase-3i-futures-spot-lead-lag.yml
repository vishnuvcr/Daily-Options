name: Phase 3I - NIFTY Futures Spot Lead-Lag

on:
  workflow_dispatch:
  push:
    branches:
      - phase-3i-futures-spot-lead-lag
    paths:
      - "research/phase3i_futures_spot_lead_lag.py"
      - "research/phase3i_option_execution.py"
      - "research/zenodo_option_source.py"
      - "research/prepare_zenodo_options.py"
      - "tests/test_phase3i_futures_spot_lead_lag.py"
      - "tests/test_phase3i_option_execution.py"
      - "docs/phase3i_hypothesis.md"
      - "docs/phase3i_option_implementation.md"
      - ".github/workflows/phase-3i-futures-spot-lead-lag.yml"

concurrency:
  group: phase3i-futures-spot-lead-lag
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          pip install pandas numpy openpyxl xlrd pytest pyarrow duckdb

      - name: Unit tests
        run: |
          pytest -q tests/test_phase3i_futures_spot_lead_lag.py tests/test_phase3i_option_execution.py

      - uses: actions/cache@v4
        with:
          path: data/cache/zenodo_nifty_spot_futures
          key: zenodo-10899828-nifty-spot-futures-v1

      - name: Acquire or reuse pinned futures spot source
        run: |
          mkdir -p data/cache/zenodo_nifty_spot_futures
          if [ ! -f data/cache/zenodo_nifty_spot_futures/source.zip ]; then
            python -c 'import urllib.request; urllib.request.urlretrieve("https://zenodo.org/records/10899828/files/Nifty%20spot%20and%20futures%20data.zip?download=1","data/cache/zenodo_nifty_spot_futures/source.zip")'
          fi
          echo "240aecc77a7275ec2f05a092b976bf91  data/cache/zenodo_nifty_spot_futures/source.zip" | md5sum -c -
          rm -rf data/cache/zenodo_nifty_spot_futures/extracted
          mkdir -p data/cache/zenodo_nifty_spot_futures/extracted
          unzip -q data/cache/zenodo_nifty_spot_futures/source.zip -d data/cache/zenodo_nifty_spot_futures/extracted
          find data/cache/zenodo_nifty_spot_futures/extracted -type f -name '*.zip' -print0 | while IFS= read -r -d '' z; do
            out="${z%.zip}"
            mkdir -p "$out"
            unzip -q "$z" -d "$out"
          done
          find data/cache/zenodo_nifty_spot_futures/extracted -type f ! -name '*.zip' | sed -n '1,80p'

      - name: Run Phase 3I data and strict predictive gate
        id: predictive
        run: |
          rm -rf reports/phase3i
          mkdir -p reports/phase3i
          python -m research.phase3i_futures_spot_lead_lag             --data data/cache/zenodo_nifty_spot_futures/extracted             --out reports/phase3i
          gate=$(python -c 'import json; print(json.load(open("reports/phase3i/phase3i_summary.json"))["predictive_gate"])')
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          echo "Phase 3I predictive gate: $gate"

      - uses: actions/cache@v4
        if: steps.predictive.outputs.gate == 'PASS'
        with:
          path: data/cache/zenodo_nifty_options
          key: zenodo-10899828-nifty-options-v1

      - name: Acquire or reuse matching 2017-2020 option archive
        if: steps.predictive.outputs.gate == 'PASS'
        run: |
          mkdir -p data/cache/zenodo_nifty_options
          if [ ! -f data/cache/zenodo_nifty_options/source.zip ]; then
            python -c 'import urllib.request; urllib.request.urlretrieve("https://zenodo.org/records/10899828/files/Nifty%20Options%20Data.zip?download=1","data/cache/zenodo_nifty_options/source.zip")'
          fi
          echo "717d15361af52d1d654b4909d998967e  data/cache/zenodo_nifty_options/source.zip" | md5sum -c -
          rm -rf data/cache/zenodo_nifty_options/extracted
          mkdir -p data/cache/zenodo_nifty_options/extracted
          python -m research.prepare_zenodo_options             --archive data/cache/zenodo_nifty_options/source.zip             --signals reports/phase3i/phase3i_signals.csv             --out data/cache/zenodo_nifty_options/extracted
          find data/cache/zenodo_nifty_options/extracted -type f \( -name '*.csv' -o -name '*.xlsx' -o -name '*.xls' \) | wc -l

      - name: Run Phase 3I option implementation - base
        if: steps.predictive.outputs.gate == 'PASS'
        run: |
          python -m research.phase3i_option_execution             --options data/cache/zenodo_nifty_options/extracted             --futures data/cache/zenodo_nifty_spot_futures/extracted             --out reports/phase3i-option-base             --slippage 0.20

      - name: Run Phase 3I option implementation - stress
        if: steps.predictive.outputs.gate == 'PASS'
        run: |
          python -m research.phase3i_option_execution             --options data/cache/zenodo_nifty_options/extracted             --futures data/cache/zenodo_nifty_spot_futures/extracted             --out reports/phase3i-option-stress             --slippage 0.40

      - name: Write Phase 3I decision summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("reports/phase3i")
          out.mkdir(parents=True, exist_ok=True)
          predictive = {}
          p = out / "phase3i_summary.json"
          if p.exists():
              predictive = json.loads(p.read_text())
          base = {}
          bp = Path("reports/phase3i-option-base/phase3i_option_summary.json")
          if bp.exists():
              base = json.loads(bp.read_text())
          stress = {}
          sp = Path("reports/phase3i-option-stress/phase3i_option_summary.json")
          if sp.exists():
              stress = json.loads(sp.read_text())
          final_gate = "NOT_REACHED"
          if predictive.get("predictive_gate") == "PASS":
              final_gate = "PASS_PRELIMINARY" if (
                  base.get("walk_forward", {}).get("gate") == "PASS_PRELIMINARY"
                  or stress.get("walk_forward", {}).get("gate") == "PASS_PRELIMINARY"
              ) else "FAIL_PRELIMINARY"
          summary = {
              "predictive": predictive,
              "option_base": base,
              "option_stress": stress,
              "final_gate": final_gate,
          }
          (out / "phase3i_decision_summary.json").write_text(json.dumps(summary, indent=2, default=str))
          print(json.dumps(summary, indent=2, default=str))
          PY

      - name: Upload Phase 3I reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3i-futures-spot-lead-lag
          path: reports/
