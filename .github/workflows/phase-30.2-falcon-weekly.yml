name: Phase 30.2 - Equity Income Falcon weekly signal diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/phase30-2-diagnostic-run-v4.txt"

permissions:
  contents: write

concurrency:
  group: phase30-2-falcon-signal-diagnostic-v4
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-30.2-falcon-signal-diagnostic-v4
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas duckdb pyarrow huggingface_hub
      - name: Cache Rissin NIFTY data
        uses: actions/cache@v4
        with:
          path: data/cache/phase30_2_rissin
          key: phase30-2-rissin-nifty-runtime-resolved-v1
      - name: Acquire and pin exact Rissin files
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase30_2_rissin
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download
          repo_id="rissin/nse-options-intraday"
          sha=HfApi().dataset_info(repo_id).sha
          out=Path("data/cache/phase30_2_rissin")
          for year in ("2025","2026"):
              target=out/f"NIFTY_{year}.parquet"
              if not target.exists():
                  p=hf_hub_download(repo_id=repo_id,filename=f"upstox_intraday/NIFTY/NIFTY_{year}.parquet",repo_type="dataset",revision=sha,local_dir=str(out))
                  Path(p).replace(target) if Path(p)!=target else None
          (out/"source_manifest.json").write_text(
              '{"repo":"rissin/nse-options-intraday","revision":"'+sha+'","files":["NIFTY_2025.parquet","NIFTY_2026.parquet"]}\n'
          )
          PY
      - name: Run signal diagnostic
        run: PYTHONPATH=. python research/phase30_2_signal_diagnostic.py
      - name: Persist diagnostic
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/phase30_2_signal_diagnostic.json data/cache/phase30_2_rissin/source_manifest.json
          git commit -m "Phase 30.2: persist Falcon signal diagnostic"
          git push origin HEAD:phase-30.2-falcon-signal-diagnostic-v4
