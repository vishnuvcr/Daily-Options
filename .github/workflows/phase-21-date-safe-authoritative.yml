name: Phase 21 Date-Safe Authoritative

on:
  workflow_dispatch:
  push:
    branches: [phase21-datefix-authoritative]

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase21-datefix-authoritative
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow duckdb yfinance pytest huggingface_hub
      - run: PYTHONPATH=. pytest -q tests/test_phase21_regime_switch_gamma_vega_v1.py
      - uses: actions/cache@v4
        with:
          path: |
            data/cache/phase19_trademarkk
            data/cache/phase21_global
          key: phase21-datefix-trademarkk-v1
          restore-keys: |
            phase19-trademarkk-51ca58c-v1
            phase19-trademarkk-
      - name: Acquire exact-expiry data
        run: |
          set -euo pipefail
          mkdir -p data/cache/phase19_trademarkk
          if [ ! -f data/cache/phase19_trademarkk/index/NIFTY.parquet ]; then
            for attempt in 1 2 3 4; do
              python -c 'from huggingface_hub import snapshot_download; snapshot_download(repo_id="thetrademarkk/india-index-options-1m",repo_type="dataset",revision="51ca58c",local_dir="data/cache/phase19_trademarkk",allow_patterns=["index/NIFTY.parquet","options/NIFTY/*.parquet"])' && break
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep $((attempt*15))
            done
          fi
      - name: Base
        run: |
          PYTHONPATH=. python -m research.phase21_datefix_wrapper             --data data/cache/phase19_trademarkk             --global-root data/cache/phase21_global             --out reports/base             --slippage 0.20
      - name: Stress
        run: |
          PYTHONPATH=. python -m research.phase21_datefix_wrapper             --data data/cache/phase19_trademarkk             --global-root data/cache/phase21_global             --out reports/stress             --slippage 0.40
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase21-date-safe-authoritative
          path: reports/
